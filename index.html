<title>KamChey Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;600&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: a lender's ledger. Sticky header and tab strip over one centred column (max 1040px); lists are ruled ledger rows with amounts in a monospaced column on the right; title papers carry a dashed "stamp" number. */
:root {
  --paper: #F2F4F3;
  --surface: #FFFFFF;
  --sunk: #E8EDEB;
  --ink: #14201C;
  --muted: #56655F;
  --line: #D6DEDA;
  --accent: #2E45B8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E8FA;
  --good: #19704A;
  --good-bg: #DFF1E7;
  --warn: #8A5000;
  --warn-bg: #FAEDD5;
  --bad: #B3261E;
  --bad-bg: #FAE4E1;
  --scrim: rgb(10 16 14 / 55%);
  --shadow: 0 1px 2px rgb(20 32 28 / 6%), 0 10px 30px rgb(20 32 28 / 14%);
  --font-display: "Zilla Slab", "Noto Sans Khmer", Rockwell, Georgia, serif;
  --font-body: "IBM Plex Sans", "Noto Sans Khmer", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1513; --surface: #161E1B; --sunk: #1E2824; --ink: #E3EAE7; --muted: #97A7A1; --line: #2B3732;
    --accent: #95A7FF; --accent-ink: #0C1230; --accent-soft: #1F2648;
    --good: #62CF97; --good-bg: #12321F; --warn: #F2B85A; --warn-bg: #36270C; --bad: #FF9087; --bad-bg: #3C1613;
    --scrim: rgb(0 0 0 / 70%); --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 30px rgb(0 0 0 / 50%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1513; --surface: #161E1B; --sunk: #1E2824; --ink: #E3EAE7; --muted: #97A7A1; --line: #2B3732;
  --accent: #95A7FF; --accent-ink: #0C1230; --accent-soft: #1F2648;
  --good: #62CF97; --good-bg: #12321F; --warn: #F2B85A; --warn-bg: #36270C; --bad: #FF9087; --bad-bg: #3C1613;
  --scrim: rgb(0 0 0 / 70%); --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 30px rgb(0 0 0 / 50%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 30px; letter-spacing: -0.01em; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
p { margin: 0; }
.mono, .amt, .kpi-num, .loan-no, .deed, .callout-big, .fact-num, td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding-block: 12px 4px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.seal { width: 30px; height: 30px; flex: none; }
.seal .bg { fill: var(--accent); }
.seal .fg { fill: none; stroke: var(--accent-ink); stroke-width: 1.6; stroke-linecap: round; }
.brand-name { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name small { margin-top: 3px; font-family: var(--font-body); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top-actions { display: flex; gap: 8px; }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; margin-inline: -6px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; padding: 10px 8px 11px; text-align: center; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.main { padding-block: 22px 64px; display: flex; flex-direction: column; gap: 28px; }
.main > section:not(.kpis), .stack { display: flex; flex-direction: column; gap: 12px; }

.btn { font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { min-height: 32px; padding: 5px 11px; font-size: 13px; }
.btn:disabled { opacity: 0.55; cursor: default; filter: none; }
.link { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; padding: 4px 2px; color: var(--accent); cursor: pointer; }
.link.danger { color: var(--bad); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.readonly .w { display: none !important; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; }
.sec-head p, .lede { color: var(--muted); font-size: 14px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .lede { margin-top: 4px; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.kpi-num { font-size: clamp(20px, 5.4vw, 27px); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.kpi-sub { font-size: 13px; color: var(--muted); }
.kpi.is-bad .kpi-num { color: var(--bad); }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; gap: 6px 16px; padding: 12px 16px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.list > .row:first-child { border-top: 0; }
a.row:hover { background: var(--sunk); }
.row-main { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-weight: 600; display: flex; gap: 4px 8px; align-items: baseline; flex-wrap: wrap; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-sub.owe { color: var(--bad); font-weight: 600; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; text-align: right; flex: 0 1 auto; margin-left: auto; }
.row-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.row-actions { display: flex; gap: 10px; }
.amt { font-weight: 600; }
.loan-no { font-size: 12px; font-weight: 500; color: var(--muted); }
.stub { flex: none; width: 48px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0 3px; background: var(--paper); }
.stub b { display: block; font-family: var(--font-num); font-size: 18px; line-height: 1.15; }
.stub span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.deed { display: inline-block; font-size: 13.5px; font-weight: 600; color: var(--accent); border: 1.5px dashed currentColor; border-radius: 5px; padding: 2px 8px; letter-spacing: 0.02em; overflow-wrap: anywhere; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.filter .count { font-family: var(--font-num); font-weight: 500; margin-left: 2px; }
.filter[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.search { flex: 1 1 220px; max-width: 360px; }

.calm { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); font-size: 14px; }
.notice { background: var(--warn-bg); border-radius: var(--r); padding: 12px 16px; font-size: 14px; }
.banner { display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; font-size: 14px; }

.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 8px; }
.detail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.detail-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 0; }
@media (min-width: 760px) { .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fact { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact dt { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.fact dd { margin: 0; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.fact-num { font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.fact-sub { font-size: 13px; color: var(--muted); }
.callout { border-radius: var(--r); padding: 16px 18px; display: flex; gap: 14px 28px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); }
.callout.good { background: var(--good-bg); border-color: transparent; }
.callout.warn { background: var(--warn-bg); border-color: transparent; }
.callout.bad { background: var(--bad-bg); border-color: transparent; }
.callout-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.callout-big { font-size: 28px; font-weight: 600; line-height: 1.2; }
.callout.bad .callout-big { color: var(--bad); }
.callout.warn .callout-big { color: var(--warn); }
.callout.good .callout-big { color: var(--good); }
.callout-sub { font-size: 13.5px; color: var(--muted); }
.callout-side { display: flex; gap: 14px 28px; flex-wrap: wrap; }
.callout-side .mono { font-size: 18px; font-weight: 600; }

.title-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.title-card.is-returned { background: var(--paper); }
.title-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 18px; margin: 0; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thumb { width: 68px; height: 68px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); padding: 0; background: var(--sunk); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.broken img { visibility: hidden; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.file-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 14px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
th.num, td.num { text-align: right; }
tr.upcoming td { color: var(--muted); }
.month-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.month-head span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.notes { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.contact { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 0; }
.contact div { min-width: 0; }
.contact dt { font-size: 12px; color: var(--muted); }
.contact dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
.empty-hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; }
.empty-hero p { max-width: 62ch; color: var(--muted); }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 66ch; }
.skeleton { height: 12px; border-radius: 6px; background: var(--sunk); }

dialog { color: var(--ink); }
.sheet { border: 0; padding: 0; border-radius: 14px; background: var(--surface); width: min(580px, calc(100vw - 20px)); max-height: calc(100vh - 24px); overflow: hidden; box-shadow: var(--shadow); }
.sheet.narrow { width: min(430px, calc(100vw - 20px)); }
.sheet::backdrop, .viewer::backdrop { background: var(--scrim); }
.sheet form { display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
@supports (height: 100dvh) { .sheet, .sheet form { max-height: calc(100dvh - 24px); } }
.sheet-head { padding: 18px 20px 4px; }
.sheet-body { padding: 12px 20px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; min-height: 42px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; min-height: 0; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { padding: 0 6px; font-weight: 600; font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check small { display: block; color: var(--muted); font-size: 12.5px; }
.form-error { color: var(--bad); font-weight: 600; font-size: 14px; }
.infobox { background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
.infobox b { font-weight: 600; }
.infobox .warn-line { color: var(--warn); font-weight: 600; }
.infobox .bad-line { color: var(--bad); font-weight: 600; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick:empty { display: none; }
.quick button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; }
.quick button:hover { background: var(--accent-soft); }
.with-chips { display: flex; gap: 6px; align-items: center; }
.with-chips input { flex: 1 1 auto; }
.with-chips button { flex: none; font: inherit; font-size: 13px; font-weight: 600; padding: 0 10px; min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.with-chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.viewer { border: 0; padding: 12px; border-radius: 14px; background: var(--surface); max-width: min(980px, calc(100vw - 20px)); max-height: calc(100vh - 20px); box-shadow: var(--shadow); }
.viewer figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.viewer img { display: block; max-width: 100%; max-height: calc(100vh - 120px); border-radius: 8px; margin: 0 auto; }
.viewer figcaption { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100vw - 32px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 560px) {
  h1 { font-size: 25px; }
  .brand { font-size: 18px; }
  .seal { width: 26px; height: 26px; }
  .top-actions .btn { min-height: 34px; padding: 6px 10px; font-size: 13px; }
  .tab { font-size: 13px; padding-inline: 6px; }
  .callout-big { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---- UI review (Nov 2026): type, spacing, icons, menus, touch, phone layout ---- */
.mono, .amt, .kpi-num, .callout-big, .fact-num, td.num { font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.loan-no, .deed, .mono-id { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.main { padding-block: 24px 64px; gap: 32px; }
.brand-name small { font-size: 11px; letter-spacing: .16em; }
.top-right { display: flex; align-items: center; gap: 8px; }
.tabs { gap: 28px; margin-inline: 0; }
.tab { flex: 0 0 auto; padding: 12px 2px 11px; display: inline-flex; align-items: center; gap: 6px; }
.tab .ico { display: none; }
.kpi { padding: 16px; gap: 4px; }
.kpi-label, .fact dt, .callout-label, .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); }
.kpi-num { font-size: clamp(22px, 5.6vw, 28px); font-weight: 650; letter-spacing: -0.01em; }
.fact { padding: 12px 16px; }
.fact-num { font-size: 20px; }
.callout { padding: 16px 20px; }
.callout-big { font-size: 32px; font-weight: 650; letter-spacing: -0.01em; }
.callout-side .mono { font-size: 20px; }
.title-card { padding: 16px; gap: 12px; }
.card { padding: 20px; gap: 16px; }
.empty-hero { padding: 32px 24px; gap: 16px; }
.hint, .check small { font-size: 13px; }
.stub span { font-size: 11px; }
thead th { font-size: 12px; }

<script>
/* ENGINE START */
const Engine = (() => {
  const DAY = 86400000;
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const parts = s => s.split('-').map(Number);
  const utc = s => { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d); };
  const pad = n => String(n).padStart(2, '0');
  const ymd = t => { const d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
  const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const round2 = x => Math.round((x + (x >= 0 ? 1 : -1) * 1e-9) * 100) / 100;

  // Same day-of-month n months later, clamped to the month's end (31 Jan + 1 month = 28/29 Feb).
  function addMonths(s, n) {
    const [y, m, d] = parts(s);
    const t = m - 1 + n;
    const y2 = y + Math.floor(t / 12), m2 = ((t % 12) + 12) % 12 + 1;
    return y2 + '-' + pad(m2) + '-' + pad(Math.min(d, daysInMonth(y2, m2)));
  }
  const addDays = (s, n) => ymd(utc(s) + n * DAY);
  const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / DAY);

  // Interest is charged per month (start date + k months) on the balance still owed.
  // rule: 'full' = a started final month costs a full month; 'days' = interest counted by the day;
  //       'none' = an unfinished final month costs nothing.
  function computeLoan(loan, payments, asOf, rule) {
    const P = Math.max(0, Number(loan.principal) || 0);
    const rate = Math.max(0, Number(loan.rate) || 0);
    const start = loan.startDate;
    const valid = isDate(start) && P > 0;
    const pays = payments.filter(p => isDate(p.date)).slice()
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

    const steps = [];
    let repaid = 0, closedOn = null;
    for (const p of pays) {
      const amt = Number(p.principal) || 0;
      if (amt <= 0) continue;
      repaid = round2(repaid + amt);
      const date = valid && p.date < start ? start : p.date;
      const last = steps[steps.length - 1];
      if (last && last.date === date) last.repaid = repaid; else steps.push({ date, repaid });
      if (!closedOn && valid && repaid >= P - 0.005) closedOn = date;
    }
    const repaidBy = d => { let r = 0; for (const s of steps) { if (s.date <= d) r = s.repaid; else break; } return r; };
    const balanceOn = d => Math.max(0, round2(P - repaidBy(d)));
    const periodInterest = (ps, pe, end) => {
      if (rule === 'days') {
        let acc = 0, cur = ps;
        for (const s of steps) {
          if (s.date > ps && s.date < end) { acc += balanceOn(cur) * daysBetween(cur, s.date); cur = s.date; }
        }
        acc += balanceOn(cur) * daysBetween(cur, end);
        return round2(rate * acc / daysBetween(ps, pe));
      }
      if (end < pe && rule === 'none') return 0;
      return round2(rate * balanceOn(ps));
    };

    const periods = [];
    let next = null;
    if (valid) {
      for (let k = 0; k < 1200; k++) {
        const ps = addMonths(start, k), pe = addMonths(start, k + 1);
        if (closedOn && ps >= closedOn) break;
        const end = closedOn && closedOn < pe ? closedOn : pe;
        const p = { n: k + 1, start: ps, due: end, balance: balanceOn(ps), interest: periodInterest(ps, pe, end), partial: end < pe, paid: 0, state: 'unpaid' };
        if (!closedOn && pe > asOf) { p.state = 'upcoming'; next = p; break; }
        periods.push(p);
      }
    }

    const interestPaid = round2(pays.reduce((s, p) => s + (Number(p.interest) || 0), 0));
    let pool = interestPaid;
    for (const p of periods) {
      p.paid = round2(Math.max(0, Math.min(pool, p.interest)));
      pool = round2(pool - p.paid);
      p.state = p.paid >= p.interest - 0.005 ? 'paid' : p.paid > 0 ? 'part' : 'unpaid';
    }
    if (next) next.paid = round2(Math.max(0, Math.min(pool, next.interest)));

    const interestCharged = round2(periods.reduce((s, p) => s + p.interest, 0));
    const interestOwed = round2(interestCharged - interestPaid);
    const owes = interestOwed > 0.004;
    const firstUnpaid = owes ? periods.find(p => p.state !== 'paid') || null : null;
    const daysLate = firstUnpaid ? Math.max(0, daysBetween(firstUnpaid.due, asOf)) : 0;
    const closed = !!closedOn;
    const outstanding = closed ? 0 : Math.max(0, round2(P - repaid));
    const maturity = isDate(start) && Number(loan.termMonths) > 0 ? addMonths(start, Math.round(Number(loan.termMonths))) : null;
    const pastMaturity = !closed && !!maturity && asOf > maturity;

    let status;
    if (closed) status = owes ? 'closed-owing' : 'closed';
    else if (pastMaturity) status = 'overdue';
    else if (owes && daysLate > 0) status = 'late';
    else if (owes) status = 'due-today';
    else if (next && daysBetween(asOf, next.due) <= 7 && next.paid < next.interest - 0.004) status = 'due-soon';
    else status = 'active';

    return {
      asOf, valid, principal: P, rate, start, repaid: Math.min(repaid, P), outstanding, closed, closedOn,
      maturity, pastMaturity, periods, next, interestCharged, interestPaid, interestOwed,
      firstUnpaid, daysLate, monthsOwed: periods.filter(p => p.state !== 'paid').length, status,
    };
  }

  // What it takes to settle the loan completely on `date`.
  function payoffQuote(loan, payments, date, rule) {
    const now = computeLoan(loan, payments, date, rule);
    if (now.closed || !now.valid) return null;
    const sim = computeLoan(loan, payments.concat([{ date, principal: now.outstanding, interest: 0 }]), date, rule);
    const interest = Math.max(0, sim.interestOwed);
    return { principal: now.outstanding, interest, total: round2(now.outstanding + interest) };
  }

  return { isDate, addMonths, addDays, daysBetween, round2, computeLoan, payoffQuote };
})();
/* ENGINE END */

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const fmtDate = s => { if (!Engine.isDate(s)) return '—'; const [y, m, d] = s.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; };

  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  const toNum = v => { const s = String(v ?? '').replace(/[$,\s]/g, ''); if (!/^-?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s); };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const cmp = (x, y) => { x = x || '9999'; y = y || '9999'; return x < y ? -1 : x > y ? 1 : 0; };
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''));
  const nameOf = id => (S.borrowers.get(id) || {}).name || 'Unknown borrower';
  const chip = (text, tone = '') => `<span class="chip ${tone}">${text}</span>`;
  const dayWord = n => (n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`);
  const groupBy = (items, key) => { const m = new Map(); for (const x of items) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
  const fv = (form, n) => { const el = form.elements.namedItem(n); return el ? String(el.value ?? '').trim() : ''; };
  const field = (id, label, control, hint = '', req = false) => `<div class="field"><label for="${id}">${label}${req ? '<span class="req" aria-hidden="true">Required</span>' : ''}</label>${req ? control.replace(/<(input|select)\b/, '<$1 aria-required="true"') : control}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
  const moneyIn = (id, name, value, placeholder = '') => `<div class="adorn"><span aria-hidden="true">$</span><input id="${id}" name="${name}" inputmode="decimal" autocomplete="off"${placeholder ? ` placeholder="${placeholder}"` : ''} value="${value ?? ''}"></div>`;
  class UserError extends Error { constructor(msg, field) { super(msg); this.field = field; } }

  // ---------- data access ----------
  async function dbCall(fn) {
    if (!S.db) throw new UserError('This ledger is not connected. Open it in Claude while signed in.');
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  const put = (path, data) => dbCall(() => S.db.doc(path).set(data));
  const patch = (path, data) => dbCall(() => S.db.doc(path).update(data));
  const drop = path => dbCall(() => S.db.doc(path).delete());

  function errText(e) {
    if (e instanceof UserError) return e.message;
    switch (e && e.code) {
      case 'quota_exceeded': return 'Storage for this ledger is full. Delete records you no longer need, then try again.';
      case 'resource_exhausted': case 'rate_limited': return 'Too many changes at once. Wait a few seconds and try again.';
      case 'unavailable': case 'store_unavailable': return 'Could not reach the server. Check your connection and try again.';
      case 'invalid_argument':
        if (!S.writeKnown) { S.canWrite = false; schedule(); return 'View-only access. Ask the owner for edit access to make changes.'; }
        return 'That could not be saved. Check the details and try again.';
      case 'revoked': case 'not_granted': return 'This page lost access to the ledger. Reload it to try again.';
      case 'too_large': return 'That photo is too large. Try a smaller one.';
      case 'unsupported_type': return 'That file type can’t be stored. Use a JPG or PNG photo.';
      case 'quota_or_state': return 'Photo storage is full. Delete old photos first.';
      default: return 'Couldn’t save. Check your connection and try again.';
    }
  }

  let toastTimer = 0;
  function toast(msg, sticky = false) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    if (!sticky) toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
  }
  async function guarded(fn) { try { await fn(); } catch (e) { console.error(e); toast(errText(e)); } }

  // ---------- derived numbers ----------
  function model() {
    const asOf = today();
    const pays = groupBy(S.payments.values(), p => p.loanId);
    const titles = groupBy(S.titles.values(), t => t.loanId);
    const byBorrower = groupBy(S.loans.values(), l => l.borrowerId);
    const calc = new Map();
    for (const l of S.loans.values()) {
      try { calc.set(l.id, Engine.computeLoan(l, pays.get(l.id) || [], asOf, S.settings.partialMonth)); }
      catch (e) { console.error('loan', l.id, e); }
    }
    return { asOf, pays, titles, byBorrower, calc };
  }
  const isBehind = c => ['late', 'overdue', 'due-today', 'closed-owing'].includes(c.status);
  const RANK = { overdue: 0, late: 1, 'due-today': 2, 'due-soon': 3, active: 4, 'closed-owing': 5, closed: 6 };
  const readyToReturn = (t, M) => {
    if (t.status === 'Returned') return false;
    const c = M.calc.get(t.loanId);
    return !!(c && c.closed && c.interestOwed <= 0.004);
  };
  const hasExamples = () => COLLS.some(n => [...S[n].values()].some(x => x.example));

  function statusChips(c) {
    const out = [];
    switch (c.status) {
      case 'overdue': out.push(chip('Past maturity', 'bad')); break;
      case 'late': out.push(chip(`Interest ${plural(c.daysLate, 'day')} overdue`, 'bad')); break;
      case 'due-today': out.push(chip('Interest due today', 'warn')); break;
      case 'due-soon': out.push(chip(`Interest due ${dayWord(Engine.daysBetween(c.asOf, c.next.due))}`, 'accent')); break;
      case 'active': out.push(chip('Current', 'good')); break;
      case 'closed': out.push(chip('Settled')); break;
      case 'closed-owing': out.push(chip('Settled · interest outstanding', 'warn')); break;
    }
    if (c.status === 'overdue' && c.interestOwed > 0.004) out.push(c.daysLate > 0 ? chip(`Interest ${plural(c.daysLate, 'day')} overdue`, 'bad') : chip('Interest due today', 'warn'));
    return out.join('');
  }

  // ---------- views ----------
  const kpi = (label, value, sub, tone = '') => `<div class="kpi ${tone ? 'is-' + tone : ''}"><div class="kpi-label">${label}</div><div class="kpi-num">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  const fact = (label, value, sub) => `<div class="fact"><dt>${label}</dt><dd><span class="fact-num">${value}</span><span class="fact-sub">${sub}</span></dd></div>`;

  function exampleBanner() {
    if (!hasExamples()) return '';
    return `<div class="banner">${ico('info')}<div><b>You are viewing sample data.</b> Clear it before entering your own loans.</div><button class="btn small w" type="button" data-act="remove-examples">Clear sample data</button></div>`;
  }

  function viewHome(M) {
    const loans = [...S.loans.values()];
    if (!loans.length) return exampleBanner() + emptyHome();
    const ym = M.asOf.slice(0, 7);
    let lent = 0, open = 0, owed = 0, behind = 0, dueMonth = 0, collected = 0;
    for (const l of loans) {
      const c = M.calc.get(l.id); if (!c) continue;
      if (!c.closed) { lent += c.outstanding; open++; }
      if (c.interestOwed > 0.004) owed += c.interestOwed;
      if (c.status === 'overdue' || (c.interestOwed > 0.004 && c.daysLate > 0)) behind++;
      for (const p of c.periods.concat(c.next ? [c.next] : [])) if (p.due.slice(0, 7) === ym) dueMonth += p.interest;
    }
    for (const p of S.payments.values()) if (String(p.date).slice(0, 7) === ym) collected += Number(p.interest) || 0;
    const held = [...S.titles.values()].filter(t => t.status !== 'Returned');
    const heldValue = held.reduce((s, t) => s + (Number(t.value) || 0), 0);

    const att = [];
    for (const l of loans) {
      const c = M.calc.get(l.id); if (!c) continue;
      const b = S.borrowers.get(l.borrowerId) || {};
      const base = { href: '#loan-' + l.id, name: b.name || 'Unknown borrower', no: loanNo(l), phone: b.phone, icon: 'clock', tone: 'bad' };
      if (c.status === 'overdue') att.push({ ...base, icon: 'alert', sev: 4, text: `Matured ${fmtDate(c.maturity)}. ${money(c.outstanding)} principal outstanding.`, chip: chip(`${plural(Engine.daysBetween(c.maturity, M.asOf), 'day')} past maturity`, 'bad') });
      if (!c.closed && c.interestOwed > 0.004) att.push({ ...base, tone: c.daysLate > 0 ? 'bad' : 'warn', sev: c.daysLate > 0 ? 3 : 2, text: `${money(c.interestOwed)} interest overdue since ${fmtDate(c.firstUnpaid && c.firstUnpaid.due)}.`, chip: c.daysLate > 0 ? chip(`${plural(c.daysLate, 'day')} overdue`, 'bad') : chip('Due today', 'warn') });
      if (c.closed && c.interestOwed > 0.004) att.push({ ...base, tone: 'warn', sev: 2, text: `Principal repaid. ${money(c.interestOwed)} interest still outstanding.`, chip: chip('Interest outstanding', 'warn') });
    }
    for (const t of held) {
      if (!readyToReturn(t, M)) continue;
      const l = S.loans.get(t.loanId), b = S.borrowers.get(l.borrowerId) || {};
      att.push({ href: '#loan-' + l.id, name: b.name || 'Unknown borrower', no: loanNo(l), phone: b.phone, icon: 'file-check', tone: 'accent', sev: 1, text: `Loan settled. Return title ${esc(t.titleNumber || '')}${t.keptAt ? ` (stored in ${esc(t.keptAt)})` : ''}.`, chip: chip('Ready to return', 'accent') });
    }
    att.sort((a, b) => b.sev - a.sev);

    const horizon = Engine.addDays(M.asOf, 14);
    const up = loans.map(l => ({ l, c: M.calc.get(l.id), b: S.borrowers.get(l.borrowerId) }))
      .filter(x => x.c && !x.c.closed && x.c.next && x.c.next.due <= horizon && x.c.next.paid < x.c.next.interest - 0.004)
      .sort((a, b) => cmp(a.c.next.due, b.c.next.due));
    const upSum = up.reduce((s, x) => s + x.c.next.interest - x.c.next.paid, 0);

    return `${exampleBanner()}
      <div class="kpis" role="group" aria-label="Summary">
        ${kpi('Outstanding principal', moneyShort(lent), plural(open, 'active loan'))}
        ${kpi('Interest overdue', moneyShort(owed), behind ? `${plural(behind, 'loan')} in arrears` : 'All loans current', owed > 0.004 ? 'bad' : '')}
        ${kpi(`Interest collected, ${MONTH[Number(ym.slice(5)) - 1]}`, moneyShort(collected), `of ${moneyShort(dueMonth)} due`)}
        ${kpi('Collateral held', String(held.length), heldValue ? `Est. value ${moneyShort(heldValue)}` : plural(held.length, 'title'))}
      </div>
      <section>
        <div class="sec-head"><h2>Action required</h2><p>${att.length ? plural(att.length, 'item') : ''}</p></div>
        ${att.length ? `<div class="list">${att.map(a => `<a class="row stubbed" href="${a.href}"><div class="row-ico ${a.tone}">${ico(a.icon)}</div>
          <div class="row-main"><div class="row-title">${esc(a.name)} <span class="loan-no">${a.no}</span></div><div class="row-sub">${a.text}${a.phone ? ` · ${esc(a.phone)}` : ''}</div><div class="row-chips">${a.chip}</div></div></a>`).join('')}</div>`
        : '<div class="calm">No overdue payments or collateral to return.</div>'}
      </section>
      <section>
        <div class="sec-head"><h2>Upcoming interest (next 14 days)</h2><p>${up.length ? `${money(upSum)} expected` : ''}</p></div>
        ${up.length ? `<div class="list">${up.map(({ l, c, b }) => {
          const [, m, d] = c.next.due.split('-').map(Number);
          return `<a class="row stubbed" href="#loan-${l.id}"><div class="stub" aria-hidden="true"><b>${d}</b><span>${MON[m - 1]}</span></div>
            <div class="row-main"><div class="row-title">${esc((b && b.name) || 'Unknown borrower')} <span class="loan-no">${loanNo(l)}</span></div>
            <div class="row-sub">Due ${fmtDate(c.next.due)} (${dayWord(Engine.daysBetween(M.asOf, c.next.due))})${b && b.phone ? ` · ${esc(b.phone)}` : ''}</div></div>
            <div class="row-side"><div class="amt">${money(c.next.interest - c.next.paid)}</div><div class="row-sub">${pct(c.rate)} of ${moneyShort(c.next.balance)}</div></div></a>`;
        }).join('')}</div>` : '<div class="calm">No interest is due in the next 14 days.</div>'}
      </section>`;
  }

  function emptyHome() {
    return `<section class="empty-hero">
      <h1>No loans yet</h1>
      <p>Record each loan with the title held as collateral. KamChey calculates the interest each month, flags loans in arrears, and tells you when collateral is ready to return.</p>
      <ol class="steps">
        <li><b>Create a loan.</b> Borrower details, principal, disbursement date, monthly rate, and the land or house title held as collateral.</li>
        <li><b>Record payments.</b> Monthly interest, and principal when it is repaid.</li>
        <li><b>Return the collateral.</b> Once principal and interest are settled, mark the title as returned.</li>
      </ol>
      <div class="btns w"><button class="btn primary" type="button" data-act="new-loan">${ico('plus')}Create first loan</button></div>
    </section>`;
  }

  function loanRow({ l, c, b }) {
    return `<a class="row" href="#loan-${l.id}">
      <div class="row-main">
        <div class="row-title">${esc((b && b.name) || 'Unknown borrower')} <span class="loan-no">${loanNo(l)}</span></div>
        <div class="row-sub">${money(c.principal)} · disbursed ${fmtDate(l.startDate)} · ${pct(c.rate)} per month${c.maturity ? ` · matures ${fmtDate(c.maturity)}` : ''}</div>
        <div class="row-chips">${statusChips(c)}</div>
      </div>
      <div class="row-side">
        <div class="amt">${money(c.closed ? c.principal : c.outstanding)}</div>
        <div class="row-sub">${c.closed ? `settled ${fmtDate(c.closedOn)}` : 'outstanding'}</div>
        ${!c.closed && c.interestOwed > 0.004 ? `<div class="row-sub owe">${money(c.interestOwed)} interest overdue</div>`
          : !c.closed && c.next ? `<div class="row-sub">Next interest ${money(c.next.interest)} on ${fmtDate(c.next.due)}</div>` : ''}
      </div></a>`;
  }
  const sortLoans = (a, b) => (RANK[a.c.status] - RANK[b.c.status])
    || (a.c.closed ? cmp(b.c.closedOn, a.c.closedOn) : cmp(a.c.next && a.c.next.due, b.c.next && b.c.next.due))
    || ((Number(b.l.number) || 0) - (Number(a.l.number) || 0));

  function viewLoans(M) {
    const items = [...S.loans.values()].map(l => ({ l, c: M.calc.get(l.id), b: S.borrowers.get(l.borrowerId) })).filter(x => x.c);
    const F = { open: x => !x.c.closed, behind: x => isBehind(x.c), closed: x => x.c.closed, all: () => true };
    const LABEL = { open: 'Active', behind: 'In arrears', closed: 'Settled', all: 'All' };
    const f = F[S.ui.loanFilter] ? S.ui.loanFilter : 'open';
    const q = S.ui.loanQ.trim().toLowerCase();
    const titleNos = id => (M.titles.get(id) || []).map(t => t.titleNumber).join(' ');
    const rows = items.filter(F[f]).filter(x => !q || [x.b && x.b.name, x.b && x.b.phone, loanNo(x.l), titleNos(x.l.id)].join(' ').toLowerCase().includes(q)).sort(sortLoans);
    return `<div class="page-head"><div><h1>Loans</h1><p class="lede">${plural(items.filter(F.open).length, 'active loan')} · ${plural(items.filter(F.closed).length, 'settled loan')}</p></div>
        <button class="btn primary w" type="button" data-act="new-loan">${ico('plus')}New loan</button></div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter loans">${Object.keys(F).map(k => `<button type="button" class="filter" data-act="loan-filter" data-v="${k}" aria-pressed="${k === f}">${LABEL[k]} <span class="count">${items.filter(F[k]).length}</span></button>`).join('')}</div>
        <input class="search" id="loan-q" type="search" placeholder="Search by name, phone, loan or title number" aria-label="Search loans" value="${esc(S.ui.loanQ)}">
      </div>
      ${rows.length ? `<div class="list">${rows.map(loanRow).join('')}</div>`
        : `<div class="calm">${items.length ? 'No loans match your search.' : 'No loans yet. Select “New loan” to create one.'}</div>`}`;
  }

  function periodChip(p, asOf) {
    if (p.state === 'paid') return chip('Paid', 'good');
    if (p.state === 'part') return chip(`${money(p.interest - p.paid)} outstanding`, p.due < asOf ? 'bad' : 'warn');
    if (p.state === 'unpaid') return p.due < asOf ? chip('Overdue', 'bad') : chip('Due today', 'warn');
    if (p.paid >= p.interest - 0.004) return chip('Prepaid', 'good');
    return chip('Upcoming');
  }

  function loanCallout(c, q) {
    if (c.closed) {
      const owes = c.interestOwed > 0.004;
      return `<div class="callout ${owes ? 'warn' : 'good'}"><div>
        <div class="callout-label">${owes ? 'Principal repaid, interest outstanding' : 'Settled'}</div>
        <div class="callout-big">${money(owes ? c.interestOwed : c.interestPaid)}</div>
        <div class="callout-sub">${owes ? 'Interest still to collect' : `Interest earned over ${plural(c.periods.length, 'month')} · settled ${fmtDate(c.closedOn)}`}</div></div></div>`;
    }
    const owes = c.interestOwed > 0.004;
    return `<div class="callout ${owes ? (c.daysLate > 0 ? 'bad' : 'warn') : 'good'}">
      <div><div class="callout-label">${owes ? 'Interest overdue' : 'Interest current'}</div>
        <div class="callout-big">${owes ? money(c.interestOwed) : c.interestOwed < -0.004 ? `${money(-c.interestOwed)} prepaid` : money(0)}</div>
        <div class="callout-sub">${owes ? `${plural(c.monthsOwed, 'month')} unpaid since ${fmtDate(c.firstUnpaid.due)}${c.daysLate > 0 ? ` (${plural(c.daysLate, 'day')})` : ' (due today)'}` : 'No payments overdue.'}</div></div>
      <div class="callout-side">
        ${c.next ? `<div><div class="callout-label">Next interest due</div><div class="mono">${money(c.next.interest)}</div><div class="callout-sub">${fmtDate(c.next.due)}</div></div>` : ''}
        ${q ? `<div><div class="callout-label">Payoff amount today</div><div class="mono">${money(q.total)}</div><div class="callout-sub">Principal ${money(q.principal)} + interest ${money(q.interest)}</div></div>` : ''}
      </div></div>`;
  }

  function viewLoan(M, r) {
    const l = S.loans.get(r.id);
    if (!l) return `<nav class="crumbs"><a href="#loans">${ico('back')}Loans</a></nav><div class="calm">This loan could not be found. It may have been deleted.</div>`;
    const c = M.calc.get(l.id);
    const b = S.borrowers.get(l.borrowerId);
    const crumbs = `<nav class="crumbs"><a href="#loans">${ico('back')}Loans</a><span aria-hidden="true">/</span><span>${loanNo(l)}</span></nav>`;
    if (!c || !c.valid) return `${crumbs}<div class="notice">Loan ${loanNo(l)} is missing its disbursement date or principal, so interest can’t be calculated.</div><div class="btns w"><button class="btn primary" type="button" data-act="edit-loan" data-id="${l.id}">Edit loan</button></div>`;
    const pays = (M.pays.get(l.id) || []).slice().sort((a, b2) => cmp(b2.date, a.date) || cmp(b2.createdAt, a.createdAt));
    const titles = (M.titles.get(l.id) || []).slice().sort((a, b2) => (a.status === 'Returned') - (b2.status === 'Returned'));
    const q = c.closed ? null : Engine.payoffQuote(l, M.pays.get(l.id) || [], M.asOf, S.settings.partialMonth);
    const sched = c.periods.concat(c.next ? [c.next] : []);
    const ruleText = S.settings.partialMonth === 'days'
      ? `Interest is ${pct(c.rate)} per month on outstanding principal, pro rata by day.`
      : `Each month’s interest is ${pct(c.rate)} of the principal outstanding at the start of that month.`;
    return `${crumbs}
      <div class="detail-head">
        <div class="detail-id">
          <div class="eyebrow">Loan ${loanNo(l)}</div>
          <h1>${esc((b && b.name) || 'Unknown borrower')}</h1>
          <div class="row-sub">${b && b.phone ? `${esc(b.phone)} · ` : ''}${b ? `<a href="#borrower-${b.id}">View borrower</a>` : ''}</div>
          <div class="row-chips">${statusChips(c)}</div>
        </div>
        <div class="head-actions w">
          ${!c.closed || c.interestOwed > 0.004 ? `<button class="btn primary" type="button" data-act="pay" data-loan="${l.id}">${ico('banknote')}Record payment</button>` : ''}
          ${!c.closed ? `<button class="btn" type="button" data-act="payoff" data-loan="${l.id}">${ico('check')}Settle loan</button>` : ''}
          ${moreMenu('More loan actions', menuItem('edit-loan', l.id, 'Edit loan', 'pencil') + '<hr>' + menuItem('del-loan', l.id, 'Delete loan', 'trash', true))}
        </div>
      </div>
      <dl class="facts">
        ${fact('Principal', money(c.principal), `Disbursed ${fmtDate(l.startDate)}`)}
        ${fact('Principal repaid', money(c.repaid), c.closed ? `In full on ${fmtDate(c.closedOn)}` : `${pct0(c.repaid / c.principal)} of principal`)}
        ${fact('Outstanding principal', money(c.outstanding), c.maturity ? `${c.pastMaturity ? 'Matured' : 'Matures'} ${fmtDate(c.maturity)}` : 'No maturity date')}
        ${fact('Interest rate', pct(c.rate), 'Per month, on outstanding principal')}
      </dl>
      ${loanCallout(c, q)}
      <section>
        <div class="sec-head"><h2>Collateral</h2><button class="btn small w" type="button" data-act="add-title" data-loan="${l.id}">${ico('plus')}Add collateral</button></div>
        ${titles.length ? `<div class="stack">${titles.map(t => titleCard(t, M, false)).join('')}</div>` : '<div class="calm">No collateral recorded for this loan.</div>'}
      </section>
      <section>
        <div class="sec-head"><h2>Payments</h2><p>Interest ${money(c.interestPaid)} · principal ${money(c.repaid)}</p></div>
        ${pays.length ? `<div class="list">${pays.map(p => payRow(p, false)).join('')}</div>`
          : `<div class="calm">No payments recorded.${c.closed ? '' : ` First interest payment due ${fmtDate(Engine.addMonths(l.startDate, 1))}.`}</div>`}
      </section>
      <section>
        <div class="sec-head"><h2>Interest schedule</h2><p>${ruleText}</p></div>
        <div class="table-wrap"><table class="sched">
          <thead><tr><th>No.</th><th>Period</th><th class="num">Opening balance</th><th class="num">Interest</th><th>Status</th></tr></thead>
          <tbody>${sched.map(p => `<tr class="${p.state}"><td class="c-n">${p.n}</td><td class="c-period">${fmtDate(p.start)} – ${fmtDate(p.due)}${p.partial ? ' (partial month)' : ''}</td><td class="num c-bal">${money(p.balance)}</td><td class="num c-int">${money(p.interest)}</td><td class="c-status">${periodChip(p, c.asOf)}</td></tr>`).join('')}</tbody>
        </table></div>
      </section>
      ${l.notes ? `<section><h2>Notes</h2><p class="notes">${esc(l.notes)}</p></section>` : ''}`;
  }

  function photoStrip(t) {
    const ids = Array.isArray(t.photos) ? t.photos.filter(x => typeof x === 'string' && /^[\w-]{1,64}$/.test(x)) : [];
    const canAdd = S.assets && S.canWrite;
    if (!ids.length && !canAdd) return '';
    return `<div class="photos">${ids.map((id, i) => `<button type="button" class="thumb" data-act="photo" data-id="${t.id}" data-asset="${id}" aria-label="Open photo ${i + 1} of title ${esc(t.titleNumber)}"><img src="/_blob/${id}" alt="" loading="lazy"></button>`).join('')}
      ${canAdd ? `<label class="btn small file-btn w" for="ph-${t.id}">${ico('camera')}Add photo<input type="file" id="ph-${t.id}" accept="image/*" multiple data-photo="${t.id}"></label>` : ''}</div>`;
  }

  function titleCard(t, M, showLoan) {
    const l = S.loans.get(t.loanId), c = l && M.calc.get(l.id), b = l && S.borrowers.get(l.borrowerId);
    const returned = t.status === 'Returned';
    const ready = readyToReturn(t, M);
    const state = returned ? chip(`Returned ${fmtDate(t.returnedDate)}`) : ready ? chip('Ready to return', 'accent') : chip('Held', 'good');
    const value = Number(t.value) || 0;
    const kv = [
      ['Property type', [t.kind, t.docType].filter(Boolean).map(esc).join(' · ')],
      ['Location', esc(t.location)],
      ['Size', Number(t.sizeM2) > 0 ? `${fmtNum(Number(t.sizeM2))} m²` : ''],
      ['Estimated value', value > 0 ? money(value) : ''],
      ['Registered owner', esc(t.ownerName)],
      ['Date received', Engine.isDate(t.receivedDate) ? fmtDate(t.receivedDate) : ''],
      ['Storage location', esc(t.keptAt)],
      ['Loan-to-value (LTV)', !returned && c && !c.closed && value > 0 ? pct0(c.outstanding / value) : ''],
      ['Returned to', returned ? esc(t.returnedTo) : ''],
      ['Return note', returned ? esc(t.returnNote) : '', 'wide'],
      ['Notes', esc(t.notes), 'wide'],
    ].filter(x => x[1]);
    return `<article class="title-card ${returned ? 'is-returned' : ''}">
      <div class="title-top"><span class="deed">${esc(t.titleNumber || 'No title number')}</span>${state}</div>
      ${showLoan ? `<div class="row-sub">${l ? `<a href="#loan-${l.id}">${esc((b && b.name) || 'Unknown borrower')} · ${loanNo(l)}</a>${c ? ` · ${c.closed ? (c.interestOwed > 0.004 ? `principal repaid, ${money(c.interestOwed)} interest outstanding` : 'loan settled') : `${money(c.outstanding)} outstanding`}` : ''}` : 'Loan deleted'}</div>` : ''}
      ${kv.length ? `<dl class="kv">${kv.map(([k, v, w]) => `<div${w ? ' class="wide"' : ''}><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
      ${photoStrip(t)}
      <div class="card-actions w">
        ${returned ? `<button class="btn small" type="button" data-act="unreturn-title" data-id="${t.id}">${ico('undo')}Undo return</button>`
          : `<button class="btn small ${ready ? 'primary' : ''}" type="button" data-act="return-title" data-id="${t.id}">${ico('file-check')}Mark as returned</button>`}
        ${dotsMenu('More collateral actions', menuItem('edit-title', t.id, 'Edit collateral', 'pencil') + '<hr>' + menuItem('del-title', t.id, 'Delete collateral', 'trash', true))}
      </div>
    </article>`;
  }

  function viewTitles(M) {
    const all = [...S.titles.values()];
    const F = { held: t => t.status !== 'Returned', ready: t => readyToReturn(t, M), returned: t => t.status === 'Returned', all: () => true };
    const LABEL = { held: 'Held', ready: 'Ready to return', returned: 'Returned', all: 'All' };
    const f = F[S.ui.titleFilter] ? S.ui.titleFilter : 'held';
    const q = S.ui.titleQ.trim().toLowerCase();
    const text = t => { const l = S.loans.get(t.loanId); return [t.titleNumber, t.location, t.ownerName, t.keptAt, t.docType, t.kind, l && nameOf(l.borrowerId), l && loanNo(l)].join(' ').toLowerCase(); };
    const rows = all.filter(F[f]).filter(t => !q || text(t).includes(q))
      .sort((a, b) => (readyToReturn(b, M) - readyToReturn(a, M)) || cmp(b.receivedDate, a.receivedDate));
    const held = all.filter(F.held);
    const heldValue = held.reduce((s, t) => s + (Number(t.value) || 0), 0);
    return `<div class="page-head"><div><h1>Collateral</h1><p class="lede">${plural(held.length, 'title')} held${heldValue ? ` · est. value ${moneyShort(heldValue)}` : ''}</p></div>
        <button class="btn primary w" type="button" data-act="add-title">${ico('plus')}Add collateral</button></div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter collateral">${Object.keys(F).map(k => `<button type="button" class="filter" data-act="title-filter" data-v="${k}" aria-pressed="${k === f}">${LABEL[k]} <span class="count">${all.filter(F[k]).length}</span></button>`).join('')}</div>
        <input class="search" id="title-q" type="search" placeholder="Search by title number, location or owner" aria-label="Search collateral" value="${esc(S.ui.titleQ)}">
      </div>
      ${rows.length ? `<div class="stack">${rows.map(t => titleCard(t, M, true)).join('')}</div>`
        : `<div class="calm">${all.length ? 'No collateral matches your search.' : 'No collateral yet. Add it when creating a loan, or select “Add collateral”.'}</div>`}`;
  }

  function borrowerTotals(M, id) {
    const loans = M.byBorrower.get(id) || [];
    let left = 0, open = 0, owed = 0, lent = 0, interest = 0, behind = false;
    for (const l of loans) {
      const c = M.calc.get(l.id); if (!c) continue;
      lent += c.principal; interest += c.interestPaid;
      if (!c.closed) { left += c.outstanding; open++; }
      if (c.interestOwed > 0.004) owed += c.interestOwed;
      if (isBehind(c)) behind = true;
    }
    return { loans, left, open, owed, lent, interest, behind };
  }

  function viewBorrowers(M) {
    const q = S.ui.borrowerQ.trim().toLowerCase();
    const all = [...S.borrowers.values()].sort(byName);
    const rows = all.filter(b => !q || [b.name, b.phone, b.phone2, b.idNumber, b.address, b.guarantorName].join(' ').toLowerCase().includes(q));
    return `<div class="page-head"><div><h1>Borrowers</h1><p class="lede">${plural(all.length, 'borrower')}</p></div>
        <button class="btn primary w" type="button" data-act="new-borrower">${ico('user-plus')}Add borrower</button></div>
      <div class="toolbar"><input class="search" id="borrower-q" type="search" placeholder="Search by name, phone or ID number" aria-label="Search borrowers" value="${esc(S.ui.borrowerQ)}"></div>
      ${rows.length ? `<div class="list">${rows.map(b => {
        const t = borrowerTotals(M, b.id);
        return `<a class="row" href="#borrower-${b.id}">
          <div class="row-main"><div class="row-title">${esc(b.name || 'No name')}</div>
            <div class="row-sub">${[b.phone && esc(b.phone), b.address && esc(b.address)].filter(Boolean).join(' · ') || 'No contact details'}</div>
            ${t.behind ? `<div class="row-chips">${chip('In arrears', 'bad')}</div>` : ''}</div>
          <div class="row-side"><div class="amt">${money(t.left)}</div><div class="row-sub">${t.open ? `outstanding on ${plural(t.open, 'loan')}` : t.loans.length ? 'No active loans' : 'No loans'}</div></div></a>`;
      }).join('')}</div>` : `<div class="calm">${all.length ? 'No borrowers match your search.' : 'No borrowers yet. Add one when creating a loan, or select “Add borrower”.'}</div>`}`;
  }

  function viewBorrower(M, r) {
    const b = S.borrowers.get(r.id);
    if (!b) return `<nav class="crumbs"><a href="#borrowers">${ico('back')}Borrowers</a></nav><div class="calm">This borrower could not be found. They may have been deleted.</div>`;
    const t = borrowerTotals(M, b.id);
    const loans = t.loans.map(l => ({ l, c: M.calc.get(l.id), b })).filter(x => x.c).sort(sortLoans);
    const contact = [
      ['Phone', esc(b.phone)],
      ['Alternate phone / Telegram', b.phone2 && esc(b.phone2)],
      ['Address', esc(b.address)],
      ['National ID number', b.idNumber && `<span class="mono-id">${esc(b.idNumber)}</span>`],
      ['Guarantor', [b.guarantorName && esc(b.guarantorName), b.guarantorPhone && esc(b.guarantorPhone)].filter(Boolean).join(' · ')],
    ].filter(x => x[1]);
    return `<nav class="crumbs"><a href="#borrowers">${ico('back')}Borrowers</a><span aria-hidden="true">/</span><span>${esc(b.name)}</span></nav>
      <div class="detail-head">
        <div class="detail-id"><div class="eyebrow">Borrower</div><h1>${esc(b.name || 'No name')}</h1>${t.behind ? `<div class="row-chips">${chip('In arrears', 'bad')}</div>` : ''}</div>
        <div class="head-actions w">
          <button class="btn primary" type="button" data-act="new-loan" data-borrower="${b.id}">${ico('plus')}New loan</button>
          <button class="btn" type="button" data-act="edit-borrower" data-id="${b.id}">${ico('pencil')}Edit borrower</button>
          ${moreMenu('More borrower actions', menuItem('del-borrower', b.id, 'Delete borrower', 'trash', true))}
        </div>
      </div>
      ${contact.length ? `<dl class="contact">${contact.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`
        : `<div class="notice">No contact details. <button class="link w" type="button" data-act="edit-borrower" data-id="${b.id}">Add phone and address</button></div>`}
      <dl class="facts">
        ${fact('Total principal lent', money(t.lent), plural(t.loans.length, 'loan'))}
        ${fact('Outstanding principal', money(t.left), plural(t.open, 'active loan'))}
        ${fact('Interest received', money(t.interest), 'Lifetime')}
        ${fact('Interest overdue', money(t.owed), t.owed > 0.004 ? 'In arrears' : 'Current')}
      </dl>
      <section><div class="sec-head"><h2>Loans</h2></div>
        ${loans.length ? `<div class="list">${loans.map(loanRow).join('')}</div>` : '<div class="calm">No loans for this borrower.</div>'}
      </section>
      ${b.notes ? `<section><h2>Notes</h2><p class="notes">${esc(b.notes)}</p></section>` : ''}`;
  }

  function payRow(p, showLoan = true) {
    const l = S.loans.get(p.loanId), b = l && S.borrowers.get(l.borrowerId);
    const i = Number(p.interest) || 0, pr = Number(p.principal) || 0;
    const what = [i ? `Interest ${money(i)}` : '', pr ? `principal ${money(pr)}` : ''].filter(Boolean).join(' + ');
    return `<div class="row">
      <div class="row-main">
        <div class="row-title">${fmtDate(p.date)}${showLoan ? (l ? ` · <a href="#loan-${l.id}">${esc((b && b.name) || 'Unknown borrower')}</a> <span class="loan-no">${loanNo(l)}</span>` : ' · Deleted loan') : ''}</div>
        <div class="row-sub">${what}${p.method ? ' · ' + esc(p.method) : ''}${p.notes ? ' · ' + esc(p.notes) : ''}</div>
      </div>
      <div class="row-side pay-side"><div class="amt">${money(i + pr)}</div>
        ${dotsMenu('Payment actions', menuItem('edit-pay', p.id, 'Edit payment', 'pencil') + '<hr>' + menuItem('del-pay', p.id, 'Delete payment', 'trash', true))}
      </div></div>`;
  }

  function viewPayments() {
    const pays = [...S.payments.values()].filter(p => Engine.isDate(p.date)).sort((a, b) => cmp(b.date, a.date) || cmp(b.createdAt, a.createdAt));
    const months = [...new Set(pays.map(p => p.date.slice(0, 7)))];
    const sel = months.includes(S.ui.payMonth) ? S.ui.payMonth : 'all';
    const shown = sel === 'all' ? pays : pays.filter(p => p.date.startsWith(sel));
    const sumI = shown.reduce((s, p) => s + (Number(p.interest) || 0), 0), sumP = shown.reduce((s, p) => s + (Number(p.principal) || 0), 0);
    const groups = groupBy(shown, p => p.date.slice(0, 7));
    return `<div class="page-head"><div><h1>Payments</h1><p class="lede">${plural(shown.length, 'payment')} · interest ${money(sumI)} · principal ${money(sumP)}</p></div>
        <button class="btn primary w" type="button" data-act="pay">${ico('banknote')}Record payment</button></div>
      <div class="toolbar"><div class="field"><label for="pay-month">Period</label><select id="pay-month">
        <option value="all" ${sel === 'all' ? 'selected' : ''}>All periods</option>${months.map(m => `<option value="${m}" ${m === sel ? 'selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select></div></div>
      ${shown.length ? [...groups.entries()].map(([m, list]) => {
        const i = list.reduce((s, p) => s + (Number(p.interest) || 0), 0), pr = list.reduce((s, p) => s + (Number(p.principal) || 0), 0);
        return `<section><div class="month-head"><h2>${fmtMonth(m)}</h2><span>Interest ${money(i)}${pr ? ` · principal ${money(pr)}` : ''}</span></div>
          <div class="list">${list.map(p => payRow(p, true)).join('')}</div></section>`;
      }).join('') : '<div class="calm">No payments recorded.</div>'}`;
  }

  function viewMore() {
    const st = S.settings;
    const r = Number(st.defaultRate) || 0.02;
    const ex = Engine.round2(5000 * r), ex2 = Engine.round2(3000 * r);
    const partial = ['full', 'days', 'none'].includes(st.partialMonth) ? st.partialMonth : 'full';
    const opt = (v, title, small) => `<label class="check"><input type="radio" name="partialMonth" value="${v}" id="s-${v}" ${partial === v ? 'checked' : ''}><span><b>${title}</b><small>${small}</small></span></label>`;
    return `<div class="page-head"><div><h1>Settings</h1><p class="lede">Interest rules, data export and access.</p></div></div>
      ${exampleBanner()}
      <form class="card" id="settings-form" novalidate>
        <h2>Interest rules</h2>
        ${field('s-rate', 'Default monthly rate (%)', `<div class="with-chips"><input id="s-rate" name="defaultRate" inputmode="decimal" value="${+(r * 100).toFixed(4)}"></div>`, 'Applies to new loans only. Each loan keeps its own rate.')}
        <fieldset><legend>Interest on a partial final month</legend>
          ${opt('full', 'Full month', 'Settling on the 5th day of a month is charged the whole month’s interest.')}
          ${opt('days', 'Pro rata by day', 'Interest is charged per day, including when part of the principal is repaid mid-month.')}
          ${opt('none', 'No charge', 'Only complete months are charged.')}
        </fieldset>
        <p class="hint">Changes apply to every loan, including settled loans.</p>
        <p class="form-error" role="alert" hidden></p>
        <div class="btns w"><button class="btn primary" type="submit">Save settings</button></div>
      </form>
      <section class="card">
        <h2>How interest is calculated</h2>
        <ul class="rules">
          <li>Interest is due monthly, on the same day of the month as the disbursement date. A loan disbursed on 10 March has interest due on 10 April, 10 May and so on.</li>
          <li>Each month’s interest is the loan’s rate times the outstanding principal. At ${pct(r)}, $5,000 accrues ${money(ex)} per month.</li>
          <li>A partial principal repayment lowers the following month’s interest. After $2,000 of $5,000 is repaid, interest is ${pct(r)} of $3,000, or ${money(ex2)}.</li>
          <li>Interest payments are applied to the oldest unpaid month first. A loan is in arrears when a month’s interest remains unpaid after its due date.</li>
          <li>A loan is settled when the full principal is repaid. Its collateral is then ready to return, once no interest is outstanding.</li>
        </ul>
      </section>
      <section class="card">
        <h2>Export data</h2>
        <p class="lede">Download all loans, payments, borrowers and collateral as an Excel workbook.</p>
        <div class="btns"><button class="btn" type="button" data-act="export" ${S.downloads ? '' : 'disabled'}>${ico('download')}Export to Excel</button></div>
        ${S.downloads ? '' : '<p class="hint">Export is available when this page is open in Claude.</p>'}
      </section>
      <section class="card">
        <h2>Access and privacy</h2>
        <p class="lede">Only you can see these records unless you share this page. Contributors and Editors can view and change every record, including phone and ID numbers. View-only users see an empty ledger.</p>
      </section>`;
  }

  // ---------- rendering ----------
  const VIEWS = { home: viewHome, loans: viewLoans, loan: viewLoan, titles: viewTitles, borrowers: viewBorrowers, borrower: viewBorrower, payments: viewPayments, more: viewMore };
  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const m = h.match(/^(loan|borrower)-([A-Za-z0-9_-]+)$/);
    if (m) return { name: m[1], id: m[2] };
    return { name: VIEWS[h] && h !== 'loan' && h !== 'borrower' ? h : 'home' };
  }
  function statusBlock() {
    if (S.mode === 'nodb') return '<div class="notice">Your records are stored in your Claude account. Open this page in Claude while signed in to view and record loans.</div>';
    if (S.mode === 'error') return `<div class="notice">${esc(S.error)}</div>`;
    return `<div class="kpis" role="group" aria-label="Summary">${['Outstanding principal', 'Interest overdue', 'Interest collected', 'Collateral held'].map(k => kpi(k, '—', 'Loading…')).join('')}</div>
      <div class="calm">Loading your records…</div>`;
  }
  let pending = 0;
  function schedule() { if (!pending) pending = setTimeout(() => { pending = 0; render(); }, 16); }
  function render() {
    const r = route();
    const tab = r.name === 'loan' ? 'loans' : r.name === 'borrower' ? 'borrowers' : r.name;
    document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.body.classList.toggle('readonly', !S.canWrite || S.mode !== 'ready');
    const ae = document.activeElement;
    const keep = ae && ae.id && view.contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    let html;
    try {
      html = S.mode === 'ready'
        ? (S.canWrite ? '' : '<div class="notice">View-only access. Ask the owner for edit access to make changes.</div>') + VIEWS[r.name](model(), r)
        : statusBlock();
    } catch (e) {
      console.error(e);
      html = '<div class="notice">This page couldn’t be displayed. Reload to try again.</div>';
    }
    view.innerHTML = html;
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.focus({ preventScroll: true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (_) { /* not a text input */ } }
    }
  }

  // ---------- dialogs ----------
  function openSheet(html, { onSubmit, onMount }) {
    const d = $('#sheet');
    d.innerHTML = html;
    const form = d.querySelector('form');
    const err = form.querySelector('.form-error');
    let dirty = false;
    form.addEventListener('input', e => { if (e.isTrusted) dirty = true; });
    const clearErrors = () => {
      if (err) err.hidden = true;
      form.querySelectorAll('.field-error').forEach(x => x.remove());
      form.querySelectorAll('[aria-invalid]').forEach(x => { x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
    };
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('[type="submit"]');
      if (btn.disabled) return;
      const label = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Saving…';
      clearErrors();
      try { await onSubmit(form); dirty = false; d.close(); }
      catch (ex) {
        if (!(ex instanceof UserError)) console.error(ex);
        const target = ex instanceof UserError && ex.field ? form.querySelector('#' + ex.field) : null;
        const box = target && target.closest('.field');
        if (box && !target.closest('[hidden]')) {
          const m = document.createElement('div');
          m.className = 'field-error'; m.id = ex.field + '-err'; m.setAttribute('role', 'alert'); m.textContent = ex.message;
          box.appendChild(m);
          target.setAttribute('aria-invalid', 'true'); target.setAttribute('aria-describedby', m.id);
          target.focus();
        } else if (err) { err.textContent = errText(ex); err.hidden = false; err.scrollIntoView({ block: 'nearest' }); }
      } finally { btn.disabled = false; btn.innerHTML = label; }
    });
    const tryClose = async () => {
      if (dirty && !await ask({ title: 'Discard changes?', body: 'The details you entered in this form will be lost.', ok: 'Discard' })) return;
      dirty = false; d.close();
    };
    form.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', tryClose));
    d.oncancel = e => { e.preventDefault(); tryClose(); };
    if (onMount) onMount(form);
    form.querySelectorAll('input[type="date"]').forEach(inp => {
      const echo = document.createElement('div');
      echo.className = 'hint date-echo'; echo.setAttribute('aria-hidden', 'true');
      inp.after(echo);
      const upd = () => { echo.textContent = Engine.isDate(inp.value) ? `${WEEKDAY[new Date(inp.value + 'T00:00:00Z').getUTCDay()]}, ${fmtDate(inp.value)}` : ''; };
      inp.addEventListener('input', upd); inp.addEventListener('change', upd); upd();
    });
    d.showModal();
    if (document.activeElement && document.activeElement.matches('.sheet-head [data-close]')) { const first = form.querySelector('.sheet-body select, .sheet-body input:not([type="checkbox"])'); if (first) first.focus(); }
  }
  const sheetShell = (title, body, submitLabel) => `<form novalidate>
    <div class="sheet-head"><h2 id="sheet-title">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ico('x')}</button></div>
    <div class="sheet-body">${body}<p class="form-error" role="alert" hidden></p></div>
    <div class="sheet-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${submitLabel}</button></div>
  </form>`;

  function ask({ title, body, ok, danger = true, info = false }) {
    return new Promise(resolve => {
      const d = $('#ask');
      d.innerHTML = `<form novalidate><div class="sheet-head"><h2 id="ask-title">${esc(title)}</h2></div>
        <div class="sheet-body"><p>${body}</p></div>
        <div class="sheet-foot">${info ? '' : '<button type="button" class="btn" id="ask-no">Cancel</button>'}<button type="submit" class="btn ${info ? 'primary' : danger ? 'danger-fill' : 'primary'}" id="ask-yes">${esc(ok)}</button></div></form>`;
      let result = false;
      d.querySelector('form').addEventListener('submit', e => { e.preventDefault(); result = !info; d.close(); });
      const no = d.querySelector('#ask-no'); if (no) no.addEventListener('click', () => d.close());
      d.addEventListener('close', () => resolve(result), { once: true });
      d.showModal();
    });
  }

  function amountOrNull(raw, label, fieldId) {
    if (!raw) return null;
    const n = toNum(raw);
    if (!Number.isFinite(n) || n < 0) throw new UserError(`${label} must be a number, like 1500.`, fieldId);
    return Engine.round2(n);
  }

  const contactFields = (p, b = {}) => `
    <div class="grid2">
      ${field(p + '-phone', 'Phone', `<input id="${p}-phone" name="phone" type="tel" autocomplete="off" value="${esc(b.phone)}">`)}
      ${field(p + '-phone2', 'Alternate phone or Telegram', `<input id="${p}-phone2" name="phone2" autocomplete="off" value="${esc(b.phone2)}">`)}
    </div>
    ${field(p + '-addr', 'Address', `<input id="${p}-addr" name="address" autocomplete="off" value="${esc(b.address)}">`)}
    ${field(p + '-idn', 'National ID number', `<input id="${p}-idn" name="idNumber" autocomplete="off" value="${esc(b.idNumber)}">`)}
    <div class="grid2">
      ${field(p + '-gname', 'Guarantor name', `<input id="${p}-gname" name="guarantorName" autocomplete="off" value="${esc(b.guarantorName)}">`)}
      ${field(p + '-gphone', 'Guarantor phone', `<input id="${p}-gphone" name="guarantorPhone" type="tel" autocomplete="off" value="${esc(b.guarantorPhone)}">`)}

  const readContact = form => ({ phone: fv(form, 'phone'), phone2: fv(form, 'phone2'), address: fv(form, 'address'), idNumber: fv(form, 'idNumber'), guarantorName: fv(form, 'guarantorName'), guarantorPhone: fv(form, 'guarantorPhone') });

  function borrowerForm(b) {

      ${contactFields('b', B)}
      ${field('b-notes', 'Notes', `<textarea id="b-notes" name="notes" rows="2">${esc(B.notes)}</textarea>`)}`, isNew ? 'Add borrower' : 'Save changes'), {
