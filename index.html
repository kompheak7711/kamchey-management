  const titleFields = (p, t = {}) => {
    const places = [...new Set([...S.titles.values()].map(x => x.keptAt).filter(Boolean))];
    return `
    <div class="grid2">
      ${field(p + '-kind', 'Property type', `<select id="${p}-kind" name="kind">${['Land', 'House', 'Land and house', 'Apartment', 'Other'].map(k => `<option ${k === (t.kind || 'Land') ? 'selected' : ''}>${k}</option>`).join('')}</select>`)}
      ${field(p + '-doctype', 'Document type', `<input id="${p}-doctype" name="docType" list="${p}-doctypes" autocomplete="off" value="${esc(t.docType)}" placeholder="e.g. Hard title">
        <datalist id="${p}-doctypes"><option value="Hard title"><option value="Soft title"><option value="Ownership certificate"><option value="Sale contract"></datalist>`)}
    </div>
    <div class="grid2">
      ${field(p + '-no', 'Title number', `<input id="${p}-no" name="titleNumber" autocomplete="off" value="${esc(t.titleNumber)}">`)}
      ${field(p + '-owner', 'Registered owner', `<input id="${p}-owner" name="ownerName" autocomplete="off" value="${esc(t.ownerName)}">`)}
    </div>
    ${field(p + '-loc', 'Property location', `<input id="${p}-loc" name="location" autocomplete="off" value="${esc(t.location)}">`)}
    <div class="grid2">
      ${field(p + '-size', 'Land area (m²)', `<input id="${p}-size" name="sizeM2" inputmode="decimal" value="${t.sizeM2 ?? ''}">`)}
      ${field(p + '-value', 'Estimated value', moneyIn(p + '-value', 'value', t.value ?? ''))}
    </div>
    ${field(p + '-kept', 'Storage location', `<input id="${p}-kept" name="keptAt" list="${p}-places" autocomplete="off" value="${esc(t.keptAt)}" placeholder="e.g. Office safe">
      <datalist id="${p}-places">${places.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`)}`;
  };
  const readTitle = form => ({
    kind: fv(form, 'kind') || 'Land', docType: fv(form, 'docType'), titleNumber: fv(form, 'titleNumber'), ownerName: fv(form, 'ownerName'),
    location: fv(form, 'location'), sizeM2: amountOrNull(fv(form, 'sizeM2'), 'Land area', form.querySelector('[name="sizeM2"]').id), value: amountOrNull(fv(form, 'value'), 'Estimated value', form.querySelector('[name="value"]').id), keptAt: fv(form, 'keptAt'),
  });
  const titleTouched = form => ['docType', 'titleNumber', 'ownerName', 'location', 'sizeM2', 'value', 'keptAt'].some(n => fv(form, n));

  function nextLoanNumber() { let max = 0; for (const l of S.loans.values()) max = Math.max(max, Number(l.number) || 0); return max + 1; }

  function loanForm(loan, presetBorrower) {
    const isNew = !loan;
    const L = loan || {};
    const list = [...S.borrowers.values()].sort(byName);
    const sel = L.borrowerId || presetBorrower || (list.length ? '' : '__new');
    const rate = isNew ? Number(S.settings.defaultRate) || 0.02 : Number(L.rate) || 0;
    const ratePct = +(rate * 100).toFixed(4);
    openSheet(sheetShell(isNew ? 'New loan' : `Edit loan ${loanNo(L)}`, `
      ${field('l-borrower', 'Borrower', `<select id="l-borrower" name="borrowerId">
        <option value="" disabled ${sel === '' ? 'selected' : ''}>Select borrower</option>
        ${list.map(b => `<option value="${esc(b.id)}" ${b.id === sel ? 'selected' : ''}>${esc(b.name)}${b.phone ? ' · ' + esc(b.phone) : ''}</option>`).join('')}
        <option value="__new" ${sel === '__new' ? 'selected' : ''}>+ Add new borrower</option></select>`, '', true)}
      <fieldset id="l-newb" ${sel === '__new' ? '' : 'hidden'}><legend>New borrower details</legend>
        ${field('l-bname', 'Full name', '<input id="l-bname" name="fullName" autocomplete="off">', '', true)}
        ${contactFields('lb')}
      </fieldset>
      <div class="grid2">
        ${field('l-start', 'Disbursement date', `<input id="l-start" name="startDate" type="date" value="${esc(L.startDate || today())}">`, '', true)}
        ${field('l-amount', 'Principal amount', moneyIn('l-amount', 'principal', L.principal ?? '', 'e.g. 5,000'), '', true)}
      </div>
      <div class="grid2">
        ${field('l-rate', 'Monthly interest rate (%)', `<div class="with-chips"><input id="l-rate" name="rate" inputmode="decimal" value="${ratePct}"><button type="button" data-rate="2" aria-label="Set rate to 2%" aria-pressed="${ratePct === 2}">2%</button><button type="button" data-rate="3" aria-label="Set rate to 3%" aria-pressed="${ratePct === 3}">3%</button></div>`, '', true)}
        ${field('l-term', 'Term (months)', `<input id="l-term" name="termMonths" inputmode="numeric" placeholder="e.g. 12" value="${L.termMonths ?? ''}">`, 'Optional. Leave blank for an open-ended loan.')}
      </div>
      <div class="infobox" id="l-preview" aria-live="polite"></div>
      ${field('l-notes', 'Notes', `<textarea id="l-notes" name="notes" rows="2">${esc(L.notes)}</textarea>`)}
      ${isNew ? `<fieldset><legend>Collateral</legend>
        <label class="check"><input type="checkbox" id="l-hastitle" name="hasTitle" checked><span>Add collateral now<small>You can also add it later from the loan page.</small></span></label>
        <div class="stack" id="l-titlefields">${titleFields('lt')}</div></fieldset>` : ''}`, isNew ? 'Create loan' : 'Save changes'), {
      onMount: form => {
        const box = form.querySelector('#l-preview');
        const rateIn = form.querySelector('#l-rate');
        const upd = () => {
          const P = toNum(fv(form, 'principal')), r = toNum(fv(form, 'rate')) / 100, start = fv(form, 'startDate'), term = fv(form, 'termMonths');
          form.querySelectorAll('[data-rate]').forEach(b => b.setAttribute('aria-pressed', String(toNum(rateIn.value) === Number(b.dataset.rate))));
          if (!(P > 0) || !(r >= 0) || !Engine.isDate(start)) { box.textContent = 'Enter the date, principal and rate to preview monthly interest.'; return; }
          box.innerHTML = `<span>Monthly interest: <b class="mono">${money(Engine.round2(P * r))}</b> on the full principal. First interest due <b>${fmtDate(Engine.addMonths(start, 1))}</b>.</span>`
            + (/^\d+$/.test(term) && +term > 0 ? `<span>Principal of ${money(P)} matures <b>${fmtDate(Engine.addMonths(start, +term))}</b>.</span>` : '<span>No maturity date (open-ended).</span>');
        };
        form.addEventListener('input', upd);
        form.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => { rateIn.value = b.dataset.rate; upd(); }));
        const bsel = form.querySelector('#l-borrower');
        bsel.addEventListener('change', () => { form.querySelector('#l-newb').hidden = bsel.value !== '__new'; if (bsel.value === '__new') form.querySelector('#l-bname').focus(); });
        const chk = form.querySelector('#l-hastitle');
        if (chk) chk.addEventListener('change', () => { form.querySelector('#l-titlefields').hidden = !chk.checked; });
        upd();
      },
      onSubmit: async form => {
        let bid = fv(form, 'borrowerId');
        const start = fv(form, 'startDate'), P = toNum(fv(form, 'principal')), rp = toNum(fv(form, 'rate')), termRaw = fv(form, 'termMonths');
        if (!bid) throw new UserError('Select a borrower, or choose “+ Add new borrower”.', 'l-borrower');
        if (bid === '__new' && !fv(form, 'fullName')) throw new UserError('Enter the new borrower’s name.', 'l-bname');
        if (!Engine.isDate(start)) throw new UserError('Enter the disbursement date.', 'l-start');
        if (!(P > 0)) throw new UserError('Enter the principal amount, for example 5000.', 'l-amount');
        if (!(rp >= 0 && rp <= 100)) throw new UserError('Enter the monthly rate as a percent, for example 2 or 3.', 'l-rate');
        if (termRaw && !(/^\d+$/.test(termRaw) && +termRaw >= 1 && +termRaw <= 600)) throw new UserError('Term must be a whole number of months, like 12. Leave it blank for an open-ended loan.', 'l-term');
        const hasTitle = isNew && form.elements.namedItem('hasTitle').checked && titleTouched(form);
        const title = hasTitle ? readTitle(form) : null;
        if (title && !title.titleNumber && !title.location) throw new UserError('Enter the title number or property location, or untick “Add collateral now”.', 'lt-no');
        const now = new Date().toISOString();
        if (bid === '__new') {
          bid = newId('b');
          await put('borrowers/' + bid, { name: fv(form, 'fullName'), ...readContact(form), notes: '', createdAt: now, updatedAt: now });
        }
        const data = { borrowerId: bid, startDate: start, principal: Engine.round2(P), rate: Math.round(rp * 10000) / 1000000, termMonths: termRaw ? +termRaw : null, notes: fv(form, 'notes'), updatedAt: now };
        if (isNew) {
          const id = newId('l');
          await put('loans/' + id, { ...data, number: nextLoanNumber(), createdAt: now });
          if (title) await put('titles/' + newId('t'), { ...title, loanId: id, receivedDate: start, status: 'Held', photos: [], notes: '', createdAt: now, updatedAt: now });
          location.hash = 'loan-' + id;
          toast('Loan created');
        } else {
          await patch('loans/' + L.id, data);
          toast('Loan updated');
        }
      },
    });
  }

  function payInfo(loanId, date, excludeId) {
    const l = S.loans.get(loanId);
    if (!l || !Engine.isDate(date)) return null;
    const pays = [...S.payments.values()].filter(p => p.loanId === loanId && p.id !== excludeId);
    const c = Engine.computeLoan(l, pays, date, S.settings.partialMonth);
    if (!c.valid) return null;
    const q = c.closed ? null : Engine.payoffQuote(l, pays, date, S.settings.partialMonth);
    return { l, c, q, owed: Math.max(0, c.interestOwed) };
  }

  function paymentForm({ loanId, payment, payoff } = {}) {
    const isNew = !payment;
    const P0 = payment || {};
    const M = model();
    const current = P0.loanId || loanId || '';
    const choices = [...S.loans.values()].map(l => ({ l, c: M.calc.get(l.id) }))
      .filter(x => x.c && x.c.valid && (!x.c.closed || x.c.interestOwed > 0.004 || x.l.id === current))
      .sort((a, b) => nameOf(a.l.borrowerId).localeCompare(nameOf(b.l.borrowerId)) || ((Number(a.l.number) || 0) - (Number(b.l.number) || 0)));
    if (!choices.length) { toast(S.loans.size ? 'All loans are settled. Create a new loan first.' : 'Create a loan first.'); return; }
    const sel = current || (choices.length === 1 ? choices[0].l.id : '');
    const fmtIn = n => (Number.isFinite(n) && n > 0 ? String(Engine.round2(n)) : '');
    openSheet(sheetShell(isNew ? (payoff ? 'Settle loan' : 'Record payment') : 'Edit payment', `
      ${field('p-loan', 'Loan', `<select id="p-loan" name="loanId"><option value="" disabled ${sel ? '' : 'selected'}>Select loan</option>
        ${choices.map(({ l, c }) => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${esc(nameOf(l.borrowerId))} · ${loanNo(l)} · ${c.closed ? 'settled' : money(c.outstanding) + ' outstanding'}</option>`).join('')}</select>`, '', true)}
      ${field('p-date', 'Payment date', `<input id="p-date" name="date" type="date" value="${esc(P0.date || today())}">`, '', true)}
      <div class="infobox" id="p-info" aria-live="polite"></div>
      <div class="quick" id="p-quick"></div>
      <div class="grid2">
        ${field('p-int', 'Interest amount', moneyIn('p-int', 'interest', P0.interest ? P0.interest : ''))}
        ${field('p-prin', 'Principal amount', moneyIn('p-prin', 'principal', P0.principal ? P0.principal : ''), 'Repayment of principal only.')}
      </div>
      <div class="grid2">
        ${field('p-method', 'Payment method', `<input id="p-method" name="method" list="p-methods" autocomplete="off" value="${esc(P0.method ?? 'Cash')}"><datalist id="p-methods"><option value="Cash"><option value="Bank transfer"><option value="ABA"><option value="Wing"><option value="Other"></datalist>`)}
        ${field('p-notes', 'Reference / note', `<input id="p-notes" name="notes" autocomplete="off" value="${esc(P0.notes)}">`)}
      </div>
      <div class="infobox" id="p-sum" aria-live="polite"></div>`, 'Save payment'), {
      onMount: form => {
        const el = id => form.querySelector('#' + id);
        let info = null;
        const fill = kind => {
          if (!info) return;
          if (kind === 'owed') { el('p-int').value = fmtIn(info.owed); el('p-prin').value = ''; }
          if (kind === 'month' && info.c.next) { el('p-int').value = fmtIn(info.owed + info.c.next.interest - info.c.next.paid); el('p-prin').value = ''; }
          if (kind === 'payoff' && info.q) { el('p-int').value = fmtIn(info.q.interest); el('p-prin').value = fmtIn(info.q.principal); }
          summary();
        };
        const summary = () => {
          const box = el('p-sum');
          const i = toNum(el('p-int').value || '0'), p = toNum(el('p-prin').value || '0');
          if (!Number.isFinite(i) || !Number.isFinite(p)) { box.innerHTML = '<span class="bad-line">Amounts must be numbers, like 150 or 2000.</span>'; return; }
          const lines = [`<span>Total amount: <b class="mono">${money(i + p)}</b></span>`];
          if (info && !info.c.closed) {
            const left = info.c.outstanding;
            if (p > left + 0.004) lines.push(`<span class="bad-line">This exceeds the ${money(left)} outstanding principal.</span>`);
            else if (p > 0 && p >= left - 0.004) {
              const held = [...S.titles.values()].filter(t => t.loanId === info.l.id && t.status !== 'Returned');
              lines.push('<span>This settles the loan.</span>');
              if (info.q && i < info.q.interest - 0.004) lines.push(`<span class="warn-line">Interest to settle: ${money(info.q.interest)}. ${money(info.q.interest - i)} would remain outstanding.</span>`);
              if (held.length) lines.push(`<span>Collateral to return: ${held.map(t => 'title ' + esc(t.titleNumber || '(no number)')).join(', ')}.</span>`);
            } else {
              if (p > 0) lines.push(`<span>Outstanding after this: <b class="mono">${money(left - p)}</b>. New monthly interest: <b class="mono">${money(Engine.round2((left - p) * info.c.rate))}</b>.</span>`);
              if (info.owed > 0.004 && i < info.owed - 0.004) lines.push(`<span class="warn-line">${money(info.owed - i)} interest will remain overdue.</span>`);
            }
          } else if (info && info.c.closed && info.owed > 0.004 && i < info.owed - 0.004) {
            lines.push(`<span class="warn-line">${money(info.owed - i)} interest will remain outstanding.</span>`);
          }
          box.innerHTML = lines.join('');
        };
        const recompute = first => {
          info = payInfo(el('p-loan').value, el('p-date').value, P0.id);
          const box = el('p-info'), quick = el('p-quick');
          if (!info) { box.textContent = 'Select a loan and date to see the amount due.'; quick.innerHTML = ''; summary(); return; }
          const { c, q, owed } = info;
          const lines = [];
          if (c.closed) lines.push(`<span>This loan was settled on <b>${fmtDate(c.closedOn)}</b>.</span>`);
          lines.push(`<span>Interest due as of ${fmtDate(el('p-date').value)}: <b class="mono">${money(owed)}</b>${owed > 0.004 && c.firstUnpaid ? ` (${plural(c.monthsOwed, 'month')}, since ${fmtDate(c.firstUnpaid.due)})` : ''}</span>`);
          if (!c.closed) {
            lines.push(`<span>Outstanding principal: <b class="mono">${money(c.outstanding)}</b> at ${pct(c.rate)} per month</span>`);
            if (c.next) lines.push(`<span>Next interest due: <b class="mono">${money(c.next.interest)}</b> on ${fmtDate(c.next.due)}</span>`);
          }
          box.innerHTML = lines.join('');
          const btns = [];
          if (owed > 0.004) btns.push(`<button type="button" data-fill="owed">Overdue interest · ${money(owed)}</button>`);
          if (!c.closed && c.next && c.next.interest - c.next.paid > 0.004) btns.push(`<button type="button" data-fill="month">${owed > 0.004 ? 'Overdue + next month' : 'Next month'} · ${money(owed + c.next.interest - c.next.paid)}</button>`);
          if (q) btns.push(`<button type="button" data-fill="payoff">Full payoff · ${money(q.total)}</button>`);
          quick.innerHTML = btns.join('');
          if (first && isNew) fill(payoff && q ? 'payoff' : owed > 0.004 ? 'owed' : 'month');
          summary();
        };
        el('p-quick').addEventListener('click', e => { const b = e.target.closest('[data-fill]'); if (b) fill(b.dataset.fill); });
        el('p-loan').addEventListener('change', () => recompute(true));
        el('p-date').addEventListener('change', () => recompute(false));
        el('p-int').addEventListener('input', summary);
        el('p-prin').addEventListener('input', summary);
        recompute(true);
      },
      onSubmit: async form => {
        const loanId = fv(form, 'loanId'), date = fv(form, 'date');
        const l = S.loans.get(loanId);
        if (!l) throw new UserError('Select the loan this payment is for.', 'p-loan');
        if (!Engine.isDate(date)) throw new UserError('Enter the payment date.', 'p-date');
        const i = amountOrNull(fv(form, 'interest'), 'Interest amount', 'p-int') || 0;
        const p = amountOrNull(fv(form, 'principal'), 'Principal amount', 'p-prin') || 0;
        if (i + p <= 0) throw new UserError('Enter an interest amount, a principal amount, or both.', 'p-int');
        const info = payInfo(loanId, date, P0.id);
        if (info && p > info.c.outstanding + 0.004) throw new UserError(`Principal amount can’t exceed the ${money(info.c.outstanding)} outstanding.`, 'p-prin');
        const now = new Date().toISOString();
        const doc = { loanId, date, interest: i, principal: p, method: fv(form, 'method'), notes: fv(form, 'notes'), updatedAt: now };
        const wasClosed = info ? info.c.closed : false;
        if (isNew) await put('payments/' + newId('p'), { ...doc, createdAt: now });
        else await patch('payments/' + P0.id, doc);
        const others = [...S.payments.values()].filter(x => x.loanId === loanId && x.id !== P0.id);
        const after = Engine.computeLoan(l, others.concat([doc]), today(), S.settings.partialMonth);
        if (after.closed && !wasClosed) {
          const held = [...S.titles.values()].filter(t => t.loanId === loanId && t.status !== 'Returned');
          toast(held.length ? 'Loan settled. Collateral is ready to return.' : 'Loan settled.');
        } else toast('Payment recorded');
      },
    });
  }

  function titleForm({ title, loanId } = {}) {
    const isNew = !title;
    const T = title || {};
    const loans = [...S.loans.values()].sort((a, b) => (Number(b.number) || 0) - (Number(a.number) || 0));
    if (!loans.length) { toast('Create a loan first. Collateral is linked to a loan.'); return; }
    const sel = T.loanId || loanId || '';
    const preset = sel && S.loans.get(sel);
    const returned = T.status === 'Returned';
    openSheet(sheetShell(isNew ? 'Add collateral' : `Edit collateral ${esc(T.titleNumber || '')}`, `
      ${field('t-loan', 'Linked loan', `<select id="t-loan" name="loanId"><option value="" disabled ${sel ? '' : 'selected'}>Select loan</option>
        ${loans.map(l => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${loanNo(l)} · ${esc(nameOf(l.borrowerId))} · ${money(Number(l.principal) || 0)}</option>`).join('')}</select>`, '', true)}
      ${titleFields('t', T)}
      ${field('t-recv', 'Date received', `<input id="t-recv" name="receivedDate" type="date" value="${esc(T.receivedDate || (preset && preset.startDate) || today())}">`)}
      ${!isNew && returned ? `<div class="grid2">
        ${field('t-rdate', 'Return date', `<input id="t-rdate" name="returnedDate" type="date" value="${esc(T.returnedDate || '')}">`)}
        ${field('t-rto', 'Returned to', `<input id="t-rto" name="returnedTo" autocomplete="off" value="${esc(T.returnedTo)}">`)}</div>` : ''}
      ${field('t-notes', 'Notes', `<textarea id="t-notes" name="notes" rows="2">${esc(T.notes)}</textarea>`)}`, isNew ? 'Save collateral' : 'Save changes'), {
      onSubmit: async form => {
        const lid = fv(form, 'loanId');
        if (!S.loans.get(lid)) throw new UserError('Select the loan this collateral secures.', 't-loan');
        const t = readTitle(form);
        if (!t.titleNumber && !t.location) throw new UserError('Enter the title number or property location.', 't-no');
        const recv = fv(form, 'receivedDate');
        const now = new Date().toISOString();
        const data = { ...t, loanId: lid, receivedDate: Engine.isDate(recv) ? recv : '', notes: fv(form, 'notes'), updatedAt: now };
        if (!isNew && returned) { data.returnedDate = fv(form, 'returnedDate'); data.returnedTo = fv(form, 'returnedTo'); }
        if (isNew) await put('titles/' + newId('t'), { ...data, status: 'Held', photos: [], createdAt: now });
        else await patch('titles/' + T.id, data);
        toast(isNew ? 'Collateral saved' : 'Collateral updated');
      },
    });
  }

  function returnForm(t) {
    if (!t) return;
    const M = model();
    const l = S.loans.get(t.loanId), c = l && M.calc.get(l.id), b = l && S.borrowers.get(l.borrowerId);
    const warn = c && !c.closed ? `<div class="infobox"><span class="warn-line">This loan still has ${money(c.outstanding)} principal outstanding${c.interestOwed > 0.004 ? ` and ${money(c.interestOwed)} interest overdue` : ''}.</span><span>Return collateral early only if this has been agreed.</span></div>`
      : c && c.interestOwed > 0.004 ? `<div class="infobox"><span class="warn-line">${money(c.interestOwed)} interest is still outstanding on this loan.</span></div>` : '';
    openSheet(sheetShell(`Return collateral ${esc(t.titleNumber || '')}`, `${warn}
      <div class="grid2">
        ${field('r-date', 'Return date', `<input id="r-date" name="returnedDate" type="date" value="${today()}">`, '', true)}
        ${field('r-to', 'Returned to', `<input id="r-to" name="returnedTo" autocomplete="off" value="${esc((b && b.name || '').replace(/ \(example\)$/, ''))}">`, 'Person who received and signed for the title.')}
      </div>

  // ---------- deletes and other actions ----------
  async function deleteLoan(id) {
    const l = S.loans.get(id); if (!l) return;
    const pays = [...S.payments.values()].filter(p => p.loanId === id).length;
    const tits = [...S.titles.values()].filter(t => t.loanId === id).length;
    if (pays || tits) {
      await ask({ title: `Loan ${loanNo(l)} can’t be deleted`, body: `It has ${[pays && plural(pays, 'payment'), tits && plural(tits, 'collateral record')].filter(Boolean).join(' and ')}. If the loan was entered by mistake, delete those first.`, ok: 'OK', info: true });
      return;
    }
    if (!await ask({ title: `Delete loan ${loanNo(l)}?`, body: `This permanently removes the ${money(Number(l.principal) || 0)} loan to ${esc(nameOf(l.borrowerId))}.`, ok: 'Delete loan' })) return;
    await guarded(async () => { await drop('loans/' + id); location.hash = 'loans'; toast('Loan deleted'); });
  }
  async function deletePayment(id) {
    const p = S.payments.get(id); if (!p) return;
    const l = S.loans.get(p.loanId);
    const amt = (Number(p.interest) || 0) + (Number(p.principal) || 0);
    if (!await ask({ title: 'Delete this payment?', body: `${money(amt)} received ${fmtDate(p.date)}${l ? ` for ${esc(nameOf(l.borrowerId))}, ${loanNo(l)}` : ''}. The loan’s balance and interest will be recalculated without it.`, ok: 'Delete payment' })) return;
    await guarded(async () => { await drop('payments/' + id); toast('Payment deleted'); });
  }
  async function deleteBorrower(id) {
    const b = S.borrowers.get(id); if (!b) return;
    const n = [...S.loans.values()].filter(l => l.borrowerId === id).length;
    if (n) { await ask({ title: `${b.name} has ${plural(n, 'loan')}`, body: 'Delete their loans first if this borrower was added by mistake. Otherwise keep them for your records.', ok: 'OK', info: true }); return; }
    if (!await ask({ title: `Delete ${b.name}?`, body: 'This permanently removes their contact details.', ok: 'Delete borrower' })) return;
    await guarded(async () => { await drop('borrowers/' + id); location.hash = 'borrowers'; toast('Borrower deleted'); });
  }
  async function deleteTitle(id) {
    const t = S.titles.get(id); if (!t) return;
    if (!await ask({ title: `Delete collateral record ${t.titleNumber || ''}?`, body: 'Only this record and its photos are removed. Make sure you know where the physical title is.', ok: 'Delete record' })) return;
    await guarded(async () => {

    const t = S.titles.get(id); if (!t) return;

    await guarded(async () => { await patch('titles/' + id, { status: 'Held', returnedDate: '', returnedTo: '', returnNote: '', updatedAt: new Date().toISOString() }); toast('Return undone'); });
  }

  async function shrink(file) {
    if (file.type && !/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return file;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (k === 1 && file.size < 2.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      return await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error('encode failed'))), 'image/jpeg', 0.85));
    } catch (e) { return file; }
  }
  async function uploadPhotos(titleId, files) {
    if (!S.assets || !files || !files.length) return;
    toast(files.length > 1 ? `Uploading ${files.length} photos…` : 'Uploading photo…', true);
    const added = [];
    let failure = null;
    for (const f of files) {
      try {
        const blob = await shrink(f);
        const type = /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : 'image/jpeg';
        const res = await S.assets.upload(blob, { type });
        added.push(res.id);
      } catch (e) { console.error(e); failure = e; }
    }
    if (added.length) {
      try {
        const cur = ((S.titles.get(titleId) || {}).photos || []).slice();
        await patch('titles/' + titleId, { photos: cur.concat(added), updatedAt: new Date().toISOString() });
      } catch (e) { toast(errText(e)); return; }
    }
    toast(failure ? errText(failure) : added.length === 1 ? 'Photo added' : `${added.length} photos added`);
  }
  function showPhoto(titleId, assetId) {
    const t = S.titles.get(titleId) || {};

  async function removeExamples() {
    const ex = name => [...S[name].values()].filter(x => x.example);
    const pays = ex('payments'), titles = ex('titles'), loans = ex('loans'), borrowers = ex('borrowers');
    const n = pays.length + titles.length + loans.length + borrowers.length;
    if (!n) return;
    if (!await ask({ title: 'Clear sample data?', body: `This deletes the sample borrowers, loans, payments and collateral (${plural(n, 'record')}). Records you added stay.`, ok: 'Clear sample data' })) return;
    toast('Clearing sample data…', true);
    await guarded(async () => {
      const keptLoan = new Set();
      for (const p of pays) await drop('payments/' + p.id);
      for (const t of titles) await drop('titles/' + t.id);
      for (const l of loans) {
        const own = [...S.payments.values()].some(p => p.loanId === l.id && !p.example) || [...S.titles.values()].some(t => t.loanId === l.id && !t.example);
        if (own) { keptLoan.add(l.id); continue; }
        await drop('loans/' + l.id);

      for (const b of borrowers) {
        const own = [...S.loans.values()].some(l => l.borrowerId === b.id && (!l.example || keptLoan.has(l.id)));
        if (!own) await drop('borrowers/' + b.id);
      }
      location.hash = 'home';
      toast('Sample data cleared');
    });
  }

  // ---------- Excel export: a small .xlsx built in the page (uncompressed zip, inline strings) ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();

    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
      c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, a) => s + a.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true); e.setUint16(20, 0, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const xmlEsc = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const colName = i => { let s = ''; for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };
  function sheetXml(rows, percentCols) {
    const keys = rows.length ? Object.keys(rows[0]) : ['No records yet'];
    const cell = (v, r, c, style) => {
      const ref = colName(c) + r;
      if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}" s="${style}"><v>${v}</v></c>`;
      if (v === '' || v == null) return '';
      return `<c r="${ref}" t="inlineStr"${style === 1 ? ' s="1"' : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    };
    const head = `<row r="1">${keys.map((k, c) => cell(k, 1, c, 1)).join('')}</row>`;
    const body = rows.map((row, i) => `<row r="${i + 2}">${keys.map((k, c) => cell(row[k], i + 2, c, percentCols.includes(k) ? 3 : 2)).join('')}</row>`).join('');
    const cols = keys.map((k, c) => `<col min="${c + 1}" max="${c + 1}" width="${Math.max(12, k.length + 3)}" customWidth="1"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${head}${body}</sheetData></worksheet>`;
  }
  function buildXlsx(sheets) {
    const NS = 'http://schemas.openxmlformats.org';
    const files = [
      { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, text: sheetXml(s.rows, s.percentCols || []) })),
    ];
    return zipStored(files);
  }
  async function exportExcel(btn) {

      });
      const payments = [...S.payments.values()].sort((a, b) => cmp(a.date, b.date)).map(p => {

  async function boot() {

    S.db = db;
    if (user) {
      try { const w = await user.can('data.write'); S.writeKnown = w !== null; if (w === false) S.canWrite = false; } catch (e) { /* treat as unknown */ }
    }
    const got = new Set();
    const arrived = name => { got.add(name); if (S.mode === 'connecting' && got.size === COLLS.length + 1) S.mode = 'ready'; schedule(); };
    for (const name of COLLS) {
      db.collection(name).onSnapshot(snap => {
        const m = new Map();
        for (const d of snap.docs) { const v = d.data(); if (v) m.set(d.id, { ...v, id: d.id }); }
        S[name] = m;
        arrived(name);
      }, onDbError);
    }
    db.doc('settings/main').onSnapshot(d => { S.settings = { ...DEFAULTS, ...(d.exists ? d.data() : {}) }; arrived('settings'); }, onDbError);
    claude.use('assets').then(a => { S.assets = a; schedule(); }).catch(() => {});
    claude.use('downloads').then(d => { S.downloads = d; schedule(); }).catch(() => {});
  }
  boot();
})();
</script>
