  const readTitle = form => ({
    kind: fv(form, 'kind') || 'Land', docType: fv(form, 'docType'), titleNumber: fv(form, 'titleNumber'), ownerName: fv(form, 'ownerName'),
    location: fv(form, 'location'), sizeM2: amountOrNull(fv(form, 'sizeM2'), 'Size'), value: amountOrNull(fv(form, 'value'), 'Estimated value'), keptAt: fv(form, 'keptAt'),
  });
  const titleTouched = form => ['docType', 'titleNumber', 'ownerName', 'location', 'sizeM2', 'value', 'keptAt'].some(n => fv(form, n));

  function nextLoanNumber() { let max = 0; for (const l of S.loans.values()) max = Math.max(max, Number(l.number) || 0); return max + 1; }

  function loanForm(loan, presetBorrower) {
    const isNew = !loan;
    const L = loan || {};
    const list = [...S.borrowers.values()].sort(byName);
    const sel = L.borrowerId || presetBorrower || (list.length ? '' : '__new');
    const rate = isNew ? Number(S.settings.defaultRate) || 0.02 : Number(L.rate) || 0;
    const ratePct = +(rate * 100).toFixed(4);
    openSheet(sheetShell(isNew ? 'New loan' : `Edit loan ${loanNo(L)}`, `
      ${field('l-borrower', 'Borrower', `<select id="l-borrower" name="borrowerId">
        <option value="" disabled ${sel === '' ? 'selected' : ''}>Choose a borrower</option>
        ${list.map(b => `<option value="${esc(b.id)}" ${b.id === sel ? 'selected' : ''}>${esc(b.name)}${b.phone ? ' · ' + esc(b.phone) : ''}</option>`).join('')}
        <option value="__new" ${sel === '__new' ? 'selected' : ''}>+ Someone new</option></select>`)}
      <fieldset id="l-newb" ${sel === '__new' ? '' : 'hidden'}><legend>New borrower’s contact details</legend>
        ${field('l-bname', 'Full name', '<input id="l-bname" name="fullName" autocomplete="off">')}
        ${contactFields('lb')}
      </fieldset>
      <div class="grid2">
        ${field('l-start', 'Date lent', `<input id="l-start" name="startDate" type="date" value="${esc(L.startDate || today())}">`)}
        ${field('l-amount', 'Amount lent (USD)', `<input id="l-amount" name="principal" inputmode="decimal" placeholder="5000" value="${L.principal ?? ''}">`)}
      </div>
      <div class="grid2">
        ${field('l-rate', 'Interest per month (%)', `<div class="with-chips"><input id="l-rate" name="rate" inputmode="decimal" value="${ratePct}"><button type="button" data-rate="2" aria-pressed="${ratePct === 2}">2%</button><button type="button" data-rate="3" aria-pressed="${ratePct === 3}">3%</button></div>`)}
        ${field('l-term', 'Months until it is due back', `<input id="l-term" name="termMonths" inputmode="numeric" placeholder="12" value="${L.termMonths ?? ''}">`, 'Leave blank if there is no fixed date.')}
      </div>
      <div class="infobox" id="l-preview" aria-live="polite"></div>
      ${field('l-notes', 'Notes', `<textarea id="l-notes" name="notes" rows="2">${esc(L.notes)}</textarea>`)}
      ${isNew ? `<fieldset><legend>Title paper you are holding</legend>
        <label class="check"><input type="checkbox" id="l-hastitle" name="hasTitle" checked><span>Record the title paper now<small>You can also add it later from the loan.</small></span></label>
        <div class="stack" id="l-titlefields">${titleFields('lt')}</div></fieldset>` : ''}`, isNew ? 'Save loan' : 'Save changes'), {
      onMount: form => {
        const box = form.querySelector('#l-preview');
        const rateIn = form.querySelector('#l-rate');
        const upd = () => {
          const P = toNum(fv(form, 'principal')), r = toNum(fv(form, 'rate')) / 100, start = fv(form, 'startDate'), term = fv(form, 'termMonths');
          form.querySelectorAll('[data-rate]').forEach(b => b.setAttribute('aria-pressed', String(toNum(rateIn.value) === Number(b.dataset.rate))));
          if (!(P > 0) || !(r >= 0) || !Engine.isDate(start)) { box.textContent = 'Enter the date, amount and rate to see the monthly interest.'; return; }
          box.innerHTML = `<span><b class="mono">${money(Engine.round2(P * r))}</b> interest a month while the full amount is owed. First interest due <b>${fmtDate(Engine.addMonths(start, 1))}</b>.</span>`
            + (/^\d+$/.test(term) && +term > 0 ? `<span>${money(P)} to be repaid by <b>${fmtDate(Engine.addMonths(start, +term))}</b>.</span>` : '<span>No fixed date to repay the loan.</span>');
        };
        form.addEventListener('input', upd);
        form.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => { rateIn.value = b.dataset.rate; upd(); }));
        const bsel = form.querySelector('#l-borrower');
        bsel.addEventListener('change', () => { form.querySelector('#l-newb').hidden = bsel.value !== '__new'; if (bsel.value === '__new') form.querySelector('#l-bname').focus(); });
        const chk = form.querySelector('#l-hastitle');
        if (chk) chk.addEventListener('change', () => { form.querySelector('#l-titlefields').hidden = !chk.checked; });
        upd();
      },
      onSubmit: async form => {
        let bid = fv(form, 'borrowerId');
        const start = fv(form, 'startDate'), P = toNum(fv(form, 'principal')), rp = toNum(fv(form, 'rate')), termRaw = fv(form, 'termMonths');
        if (!bid) throw new UserError('Choose who is borrowing, or pick “+ Someone new”.');
        if (bid === '__new' && !fv(form, 'fullName')) throw new UserError('Enter the new borrower’s name.');
        if (!Engine.isDate(start)) throw new UserError('Enter the date the money was lent.');
        if (!(P > 0)) throw new UserError('Enter the amount lent, for example 5000.');
        if (!(rp >= 0 && rp <= 100)) throw new UserError('Enter the monthly interest as a percent, for example 2 or 3.');
        if (termRaw && !(/^\d+$/.test(termRaw) && +termRaw >= 1 && +termRaw <= 600)) throw new UserError('Months until due back must be a whole number, like 12. Leave it blank if there is no fixed date.');
        const hasTitle = isNew && form.elements.namedItem('hasTitle').checked && titleTouched(form);
        const title = hasTitle ? readTitle(form) : null;
        if (title && !title.titleNumber && !title.location) throw new UserError('Enter the title number or where the property is, or untick “Record the title paper now”.');
        const now = new Date().toISOString();
        if (bid === '__new') {
          bid = newId('b');
          await put('borrowers/' + bid, { name: fv(form, 'fullName'), ...readContact(form), notes: '', createdAt: now, updatedAt: now });
        }
        const data = { borrowerId: bid, startDate: start, principal: Engine.round2(P), rate: Math.round(rp * 10000) / 1000000, termMonths: termRaw ? +termRaw : null, notes: fv(form, 'notes'), updatedAt: now };
        if (isNew) {
          const id = newId('l');
          await put('loans/' + id, { ...data, number: nextLoanNumber(), createdAt: now });
          if (title) await put('titles/' + newId('t'), { ...title, loanId: id, receivedDate: start, status: 'Held', photos: [], notes: '', createdAt: now, updatedAt: now });
          location.hash = 'loan-' + id;
          toast('Loan saved');
        } else {
          await patch('loans/' + L.id, data);
          toast('Loan updated');
        }
      },
    });
  }

  function payInfo(loanId, date, excludeId) {
    const l = S.loans.get(loanId);
    if (!l || !Engine.isDate(date)) return null;
    const pays = [...S.payments.values()].filter(p => p.loanId === loanId && p.id !== excludeId);
    const c = Engine.computeLoan(l, pays, date, S.settings.partialMonth);
    if (!c.valid) return null;
    const q = c.closed ? null : Engine.payoffQuote(l, pays, date, S.settings.partialMonth);
    return { l, c, q, owed: Math.max(0, c.interestOwed) };
  }

  function paymentForm({ loanId, payment, payoff } = {}) {
    const isNew = !payment;
    const P0 = payment || {};
    const M = model();
    const current = P0.loanId || loanId || '';
    const choices = [...S.loans.values()].map(l => ({ l, c: M.calc.get(l.id) }))
      .filter(x => x.c && x.c.valid && (!x.c.closed || x.c.interestOwed > 0.004 || x.l.id === current))
      .sort((a, b) => nameOf(a.l.borrowerId).localeCompare(nameOf(b.l.borrowerId)) || ((Number(a.l.number) || 0) - (Number(b.l.number) || 0)));
    if (!choices.length) { toast(S.loans.size ? 'Every loan is paid off. Add a new loan first.' : 'Add a loan first.'); return; }
    const sel = current || (choices.length === 1 ? choices[0].l.id : '');
    const fmtIn = n => (Number.isFinite(n) && n > 0 ? String(Engine.round2(n)) : '');
    openSheet(sheetShell(isNew ? (payoff ? 'Pay off loan' : 'Record payment') : 'Edit payment', `
      ${field('p-loan', 'Loan', `<select id="p-loan" name="loanId"><option value="" disabled ${sel ? '' : 'selected'}>Choose a loan</option>
        ${choices.map(({ l, c }) => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${esc(nameOf(l.borrowerId))} · ${loanNo(l)} · ${c.closed ? 'repaid' : money(c.outstanding) + ' left'}</option>`).join('')}</select>`)}
      ${field('p-date', 'Date received', `<input id="p-date" name="date" type="date" value="${esc(P0.date || today())}">`)}
      <div class="infobox" id="p-info" aria-live="polite"></div>
      <div class="quick" id="p-quick"></div>
      <div class="grid2">
        ${field('p-int', 'Interest received (USD)', `<input id="p-int" name="interest" inputmode="decimal" placeholder="0" value="${P0.interest ? P0.interest : ''}">`)}
        ${field('p-prin', 'Loan amount repaid (USD)', `<input id="p-prin" name="principal" inputmode="decimal" placeholder="0" value="${P0.principal ? P0.principal : ''}">`, 'Only the part of the loan itself being paid back.')}
      </div>
      <div class="grid2">
        ${field('p-method', 'Paid by', `<input id="p-method" name="method" list="p-methods" autocomplete="off" value="${esc(P0.method ?? 'Cash')}"><datalist id="p-methods"><option value="Cash"><option value="Bank transfer"><option value="ABA"><option value="Wing"><option value="Other"></datalist>`)}
        ${field('p-notes', 'Note', `<input id="p-notes" name="notes" autocomplete="off" value="${esc(P0.notes)}">`)}
      </div>
      <div class="infobox" id="p-sum" aria-live="polite"></div>`, 'Save payment'), {
      onMount: form => {
        const el = id => form.querySelector('#' + id);
        let info = null;
        const fill = kind => {
          if (!info) return;
          if (kind === 'owed') { el('p-int').value = fmtIn(info.owed); el('p-prin').value = ''; }
          if (kind === 'month' && info.c.next) { el('p-int').value = fmtIn(info.owed + info.c.next.interest - info.c.next.paid); el('p-prin').value = ''; }
          if (kind === 'payoff' && info.q) { el('p-int').value = fmtIn(info.q.interest); el('p-prin').value = fmtIn(info.q.principal); }
          summary();
        };
        const summary = () => {
          const box = el('p-sum');
          const i = toNum(el('p-int').value || '0'), p = toNum(el('p-prin').value || '0');
          if (!Number.isFinite(i) || !Number.isFinite(p)) { box.innerHTML = '<span class="bad-line">Amounts must be numbers, like 150 or 2000.</span>'; return; }
          const lines = [`<span>Total received: <b class="mono">${money(i + p)}</b></span>`];
          if (info && !info.c.closed) {
            const left = info.c.outstanding;
            if (p > left + 0.004) lines.push(`<span class="bad-line">That is more than the ${money(left)} left to repay.</span>`);
            else if (p > 0 && p >= left - 0.004) {
              const held = [...S.titles.values()].filter(t => t.loanId === info.l.id && t.status !== 'Returned');
              lines.push('<span>This pays off the loan.</span>');
              if (info.q && i < info.q.interest - 0.004) lines.push(`<span class="warn-line">Interest to settle it: ${money(info.q.interest)}. ${money(info.q.interest - i)} would still be owed.</span>`);
              if (held.length) lines.push(`<span>Then give back ${held.map(t => 'title ' + esc(t.titleNumber || '(no number)')).join(', ')}.</span>`);
            } else {
              if (p > 0) lines.push(`<span>Left to repay after this: <b class="mono">${money(left - p)}</b>. Interest from then on: <b class="mono">${money(Engine.round2((left - p) * info.c.rate))}</b> a month.</span>`);
              if (info.owed > 0.004 && i < info.owed - 0.004) lines.push(`<span class="warn-line">${money(info.owed - i)} interest will still be owed.</span>`);
            }
          } else if (info && info.c.closed && info.owed > 0.004 && i < info.owed - 0.004) {
            lines.push(`<span class="warn-line">${money(info.owed - i)} interest will still be owed.</span>`);
          }
          box.innerHTML = lines.join('');
        };
        const recompute = first => {
          info = payInfo(el('p-loan').value, el('p-date').value, P0.id);
          const box = el('p-info'), quick = el('p-quick');
          if (!info) { box.textContent = 'Choose the loan and the date to see what is owed.'; quick.innerHTML = ''; summary(); return; }
          const { c, q, owed } = info;
          const lines = [];
          if (c.closed) lines.push(`<span>This loan was repaid on <b>${fmtDate(c.closedOn)}</b>.</span>`);
          lines.push(`<span>Interest owed on ${fmtDate(el('p-date').value)}: <b class="mono">${money(owed)}</b>${owed > 0.004 && c.firstUnpaid ? ` (${plural(c.monthsOwed, 'month')}, since ${fmtDate(c.firstUnpaid.due)})` : ''}</span>`);
          if (!c.closed) {
            lines.push(`<span>Left to repay: <b class="mono">${money(c.outstanding)}</b> at ${pct(c.rate)} a month</span>`);
            if (c.next) lines.push(`<span>Next interest: <b class="mono">${money(c.next.interest)}</b> due ${fmtDate(c.next.due)}</span>`);
          }
          box.innerHTML = lines.join('');
          const btns = [];
          if (owed > 0.004) btns.push(`<button type="button" data-fill="owed">Interest owed · ${money(owed)}</button>`);
          if (!c.closed && c.next && c.next.interest - c.next.paid > 0.004) btns.push(`<button type="button" data-fill="month">${owed > 0.004 ? 'Owed + next month' : 'Next month'} · ${money(owed + c.next.interest - c.next.paid)}</button>`);

        const loanId = fv(form, 'loanId'), date = fv(form, 'date');

        const p = amountOrNull(fv(form, 'principal'), 'Loan amount repaid') || 0;

  async function shrink(file) {
    if (file.type && !/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return file;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (k === 1 && file.size < 2.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      return await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error('encode failed'))), 'image/jpeg', 0.85));
    } catch (e) { return file; }
  }
  async function uploadPhotos(titleId, files) {
    if (!S.assets || !files || !files.length) return;
    toast(files.length > 1 ? `Uploading ${files.length} photos…` : 'Uploading photo…', true);
    const added = [];
    let failure = null;
    for (const f of files) {
      try {
        const blob = await shrink(f);
        const type = /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : 'image/jpeg';
        const res = await S.assets.upload(blob, { type });
        added.push(res.id);
      } catch (e) { console.error(e); failure = e; }
    }
    if (added.length) {
      try {
        const cur = ((S.titles.get(titleId) || {}).photos || []).slice();
        await patch('titles/' + titleId, { photos: cur.concat(added), updatedAt: new Date().toISOString() });

    toast(failure ? errText(failure) : added.length === 1 ? 'Photo added' : `${added.length} photos added`);
  }

        const own = [...S.payments.values()].some(p => p.loanId === l.id && !p.example) || [...S.titles.values()].some(t => t.loanId === l.id && !t.example);

      }
      location.hash = 'home';
      toast('Example data removed');

  // ---------- Excel export: a small .xlsx built in the page (uncompressed zip, inline strings) ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = bytes => { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zipStored(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
      c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, a) => s + a.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true); e.setUint16(20, 0, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const xmlEsc = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const colName = i => { let s = ''; for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };
  function sheetXml(rows, percentCols) {
    const keys = rows.length ? Object.keys(rows[0]) : ['No records yet'];
    const cell = (v, r, c, style) => {
      const ref = colName(c) + r;
      if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}" s="${style}"><v>${v}</v></c>`;
      if (v === '' || v == null) return '';
      return `<c r="${ref}" t="inlineStr"${style === 1 ? ' s="1"' : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    };
    const head = `<row r="1">${keys.map((k, c) => cell(k, 1, c, 1)).join('')}</row>`;
    const body = rows.map((row, i) => `<row r="${i + 2}">${keys.map((k, c) => cell(row[k], i + 2, c, percentCols.includes(k) ? 3 : 2)).join('')}</row>`).join('');
    const cols = keys.map((k, c) => `<col min="${c + 1}" max="${c + 1}" width="${Math.max(12, k.length + 3)}" customWidth="1"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${head}${body}</sheetData></worksheet>`;
  }
  function buildXlsx(sheets) {
    const NS = 'http://schemas.openxmlformats.org';
    const files = [
      { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, text: sheetXml(s.rows, s.percentCols || []) })),
    ];
    return zipStored(files);
  }
  async function exportExcel(btn) {
    if (!S.downloads) { toast('Downloads work when this page is open in Claude.'); return; }
    if (btn) btn.disabled = true;
    try {
      const M = model();
      const LABEL = { active: 'Up to date', 'due-soon': 'Interest due soon', 'due-today': 'Interest due today', late: 'Interest late', overdue: 'Past due date', closed: 'Paid off', 'closed-owing': 'Paid off, interest owed' };
      const loans = [...S.loans.values()].sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0)).map(l => {
        const c = M.calc.get(l.id) || {}; const b = S.borrowers.get(l.borrowerId) || {};
        return { Loan: loanNo(l), Borrower: b.name || '', Phone: b.phone || '', 'Date lent': l.startDate || '', 'Amount lent': Number(l.principal) || 0, 'Monthly rate': Number(l.rate) || 0, 'Due back': c.maturity || '', Repaid: c.repaid || 0, 'Left to repay': c.outstanding || 0, 'Interest charged to date': c.interestCharged || 0, 'Interest paid': c.interestPaid || 0, 'Interest owed now': Math.max(0, c.interestOwed || 0), 'Next interest date': (c.next && c.next.due) || '', 'Next interest amount': c.next ? c.next.interest : '', Status: LABEL[c.status] || '', Notes: l.notes || '' };
      });
      const payments = [...S.payments.values()].sort((a, b) => cmp(a.date, b.date)).map(p => {
        const l = S.loans.get(p.loanId);
        return { Date: p.date || '', Loan: l ? loanNo(l) : '', Borrower: l ? nameOf(l.borrowerId) : '', Interest: Number(p.interest) || 0, 'Loan repaid': Number(p.principal) || 0, Total: (Number(p.interest) || 0) + (Number(p.principal) || 0), 'Paid by': p.method || '', Note: p.notes || '' };
      });
      const borrowers = [...S.borrowers.values()].sort(byName).map(b => ({ Name: b.name || '', Phone: b.phone || '', 'Second phone / Telegram': b.phone2 || '', Address: b.address || '', 'National ID': b.idNumber || '', 'Guarantor or relative': b.guarantorName || '', 'Guarantor phone': b.guarantorPhone || '', Notes: b.notes || '' }));
      const titles = [...S.titles.values()].sort((a, b) => cmp(a.receivedDate, b.receivedDate)).map(t => {
        const l = S.loans.get(t.loanId);
        return { 'Title number': t.titleNumber || '', Loan: l ? loanNo(l) : '', Borrower: l ? nameOf(l.borrowerId) : '', Property: t.kind || '', 'Type of paper': t.docType || '', 'Name on paper': t.ownerName || '', Location: t.location || '', 'Size (m2)': t.sizeM2 ?? '', 'Estimated value': t.value ?? '', Received: t.receivedDate || '', 'Kept in': t.keptAt || '', Status: t.status || '', 'Given back': t.returnedDate || '', 'Given back to': t.returnedTo || '', Notes: t.notes || '' };
      });
      const blob = buildXlsx([
        { name: 'Loans', rows: loans, percentCols: ['Monthly rate'] },
        { name: 'Payments', rows: payments },
        { name: 'Borrowers', rows: borrowers },
        { name: 'Title papers', rows: titles },
      ]);
      await S.downloads.save({ filename: `kamchey-${today()}.xlsx`, data: blob });
      toast('Excel file saved');
    } catch (e) {
      console.error(e);
      if (!(e && e.code === 'declined')) toast(e && e.code === 'rate_limited' ? 'Another download is waiting. Try again in a moment.' : 'The file could not be saved here.');
    } finally { if (btn) btn.disabled = false; }
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const id = el.dataset.id;
    if (S.mode !== 'ready' && el.dataset.act !== 'photo') return;
    switch (el.dataset.act) {
      case 'new-loan': loanForm(null, el.dataset.borrower); break;
      case 'edit-loan': if (S.loans.get(id)) loanForm(S.loans.get(id)); break;
      case 'del-loan': deleteLoan(id); break;
      case 'pay': paymentForm({ loanId: el.dataset.loan }); break;
      case 'payoff': paymentForm({ loanId: el.dataset.loan, payoff: true }); break;
      case 'edit-pay': if (S.payments.get(id)) paymentForm({ payment: S.payments.get(id) }); break;
      case 'del-pay': deletePayment(id); break;
      case 'new-borrower': borrowerForm(null); break;
      case 'edit-borrower': if (S.borrowers.get(id)) borrowerForm(S.borrowers.get(id)); break;
      case 'del-borrower': deleteBorrower(id); break;
      case 'add-title': titleForm({ loanId: el.dataset.loan }); break;
      case 'edit-title': if (S.titles.get(id)) titleForm({ title: S.titles.get(id) }); break;
      case 'del-title': deleteTitle(id); break;
      case 'return-title': returnForm(S.titles.get(id)); break;
      case 'unreturn-title': unreturn(id); break;
      case 'photo': showPhoto(id, el.dataset.asset); break;
      case 'loan-filter': S.ui.loanFilter = el.dataset.v; render(); break;
      case 'title-filter': S.ui.titleFilter = el.dataset.v; render(); break;
      case 'export': exportExcel(el); break;
      case 'remove-examples': removeExamples(); break;
    }
  });
  document.addEventListener('input', e => {
    const k = { 'loan-q': 'loanQ', 'title-q': 'titleQ', 'borrower-q': 'borrowerQ' }[e.target.id];
    if (k) { S.ui[k] = e.target.value; render(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'pay-month') { S.ui.payMonth = e.target.value; render(); }
    if (e.target.matches && e.target.matches('input[data-photo]')) { const files = [...e.target.files]; e.target.value = ''; uploadPhotos(e.target.dataset.photo, files); }
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'settings-form') return;
    e.preventDefault();
    const form = e.target, err = form.querySelector('.form-error');
    err.hidden = true;
    const rp = toNum(fv(form, 'defaultRate'));
    const partial = fv(form, 'partialMonth');
    if (!(rp >= 0 && rp <= 100)) { err.textContent = 'Enter the monthly interest as a percent, for example 2.'; err.hidden = false; return; }
    try {
      await put('settings/main', { defaultRate: Math.round(rp * 10000) / 1000000, partialMonth: ['full', 'days', 'none'].includes(partial) ? partial : 'full', updatedAt: new Date().toISOString() });
      toast('Rules saved');
    } catch (ex) { err.textContent = errText(ex); err.hidden = false; }
  });
  document.addEventListener('error', e => {
    const img = e.target;
    if (img && img.tagName === 'IMG' && img.closest('.thumb')) img.closest('.thumb').classList.add('broken');
  }, true);
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // ---------- start ----------
  function onDbError(e) {
    console.error(e);
    S.mode = 'error';
    S.error = e && e.code === 'revoked' ? 'This page lost access to the ledger. Reload it to try again.' : 'Lost the connection to the ledger. Reload the page to try again.';
    schedule();
  }
  async function boot() {
    render();
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') { S.mode = 'nodb'; render(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) { console.error(e); }
    if (!db) { S.mode = 'nodb'; render(); return; }
    S.db = db;
    if (user) {
      try { const w = await user.can('data.write'); S.writeKnown = w !== null; if (w === false) S.canWrite = false; } catch (e) { /* treat as unknown */ }
    }
    const got = new Set();
    const arrived = name => { got.add(name); if (S.mode === 'connecting' && got.size === COLLS.length + 1) S.mode = 'ready'; schedule(); };
    for (const name of COLLS) {
      db.collection(name).onSnapshot(snap => {
        const m = new Map();
        for (const d of snap.docs) { const v = d.data(); if (v) m.set(d.id, { ...v, id: d.id }); }
        S[name] = m;
        arrived(name);
      }, onDbError);
    }
    db.doc('settings/main').onSnapshot(d => { S.settings = { ...DEFAULTS, ...(d.exists ? d.data() : {}) }; arrived('settings'); }, onDbError);
    claude.use('assets').then(a => { S.assets = a; schedule(); }).catch(() => {});
    claude.use('downloads').then(d => { S.downloads = d; schedule(); }).catch(() => {});
  }
  boot();
})();
</script>
